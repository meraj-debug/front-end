   ()=>{
     const lines=el('csv').value.trim().split('\n').filter(Boolean);
     if(!lines.length) return toast('Paste at least one row','fa-triangle-exclamation');
     const ch=CHANNELS.find(c=>c.k==='manual');
     let made=0,dups=0;
     lines.forEach(l=>{
       const [name,mobile,email,source,project,budget]=l.split(',').map(x=>(x||'').trim());
       if(!mobile) return;
       const r=ingestLead({name,mobile,email,project,budget,subSource:'Manual import'},{...ch,source:source||'Referral',n:'Manual import'});
       r.dup?dups++:made++;

     ch.pulled+=made; ch.last=now().toISOString();
     closeModal(); buildNav(); toast(`Imported ${made} new · ${dups} matched existing`); render();

<script>
/* ============================================================================
   INFRAMANTRA CRM — v6 PATCH LAYER
   Loads AFTER the v5 script. Everything here either adds new globals or
   re-points existing global functions (window.fn = ...), so the v5 engine
   keeps working and simply behaves better.
   ============================================================================ */

/* ---------------------------------------------------------------- v6 store */
const V6 = {
  views:   [],   // list views (customers / deals / bookings / projects / tasks)
  shares:  [],   // manual record shares  {kind,id,to,access:'read'|'edit',by,at,note}
  rules:   [],   // lead-assignment rules (Pre-Sales TL owns these)
  rr:      {},   // round-robin cursors per rule
  reports: [],   // saved reports (v2)
  folders: [],   // report folders
  subs:    [],   // report/dashboard e-mail subscriptions
  intake:  [],   // no-API lead intake templates
  sec:     { idleMins:30, pwdDays:90, warnDays:30 },
  ownerLog:[],   // owner-change log across all objects
  outbox:  []    // simulated welcome / password-reset emails
};
window.V6 = V6;

const V6_KIND = { customer:'Customer', deal:'Deal', booking:'Booking', project:'Project' };
function V6_kindOfId(id){
  const s = String(id||'');
  if (s.startsWith('CUS-')) return 'Customer';
  if (s.startsWith('D-'))   return 'Deal';
  if (s.startsWith('B-'))   return 'Booking';
  if (s.startsWith('P-'))   return 'Project';
  return '';
}
const V6_now = () => new Date().toISOString();
function V6_uid(p){ return p + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }

/* ============================================================================
   1 · DEPARTMENT READ / EDIT MATRIX  (what the business actually asked for)
     Pre Sales : sees Customer + Deal + Booking · edits ONLY Customer
     Sales     : sees Customer + Deal + Booking · edits ONLY Deal
     Post Sales: sees + edits ONLY Booking (its own section)
     BA        : sees ONLY its own Customer + Deal · edits nothing
   ========================================================================== */
(function V6_permissionMatrix(){
  const P = (r,c,e,d) => ({r,c,e,d});

  // Pre Sales
  ['Pre-Sales Executive','Pre-Sales Team Leader'].forEach(p=>{
    if(!PROFILES[p]) return;
    PROFILES[p].obj.Customer = P(1,1,1, p==='Pre-Sales Team Leader'?1:0);
    PROFILES[p].obj.Deal     = P(1,0,0,0);   // read-only
    PROFILES[p].obj.Booking  = P(1,0,0,0);   // read-only
    PROFILES[p].obj.Project  = P(1,0,0,0);
    PROFILES[p].obj.Report   = P(1,1,1,0);
  });
  // the Pre-Sales Team Leader — not the sysadmin — owns lead assignment
  PROFILES['Pre-Sales Team Leader'].act.manageAssignment = 1;
  PROFILES['Pre-Sales Team Leader'].act.manageShares     = 1;
  PROFILES['Pre-Sales Team Leader'].act.export           = 1;
  PROFILES['Pre-Sales Executive'].act.manageAssignment   = 0;

  // Sales — no Customer access (customers & customer reports belong to Pre-Sales)
  ['Sales Executive (RM)','Sales Team Leader'].forEach(p=>{
    if(!PROFILES[p]) return;
    PROFILES[p].obj.Customer = P(0,0,0,0);   // no customer tab / no customer reports
    PROFILES[p].obj.Deal     = P(1,1,1, p==='Sales Team Leader'?1:0);
    PROFILES[p].obj.Booking  = P(1,1,0,0);   // can raise the login form, cannot edit post-sales
    PROFILES[p].obj.Project  = P(1,0,0,0);
    PROFILES[p].obj.Report   = P(1,1,1,0);
  });
  PROFILES['Sales Team Leader'].act.manageShares = 1;

  // Post Sales — its own section only
  ['Post-Sales Executive','Post-Sales Team Leader'].forEach(p=>{
    if(!PROFILES[p]) return;
    PROFILES[p].obj.Customer = P(0,0,0,0);
    PROFILES[p].obj.Deal     = P(0,0,0,0);
    PROFILES[p].obj.Booking  = P(1,1,1,0);
    PROFILES[p].obj.Project  = P(1,0,0,0);
    PROFILES[p].obj.Report   = P(1,1,1,0);
    PROFILES[p].act.postStage = 1;
  });

  // Business Associate — read-only on its own leads · ONLY Customer & Deal
  if(PROFILES['Business Associate']){
    PROFILES['Business Associate'].obj.Customer = P(1,0,0,0);
    PROFILES['Business Associate'].obj.Deal     = P(1,0,0,0);
    PROFILES['Business Associate'].obj.Booking  = P(0,0,0,0);
    PROFILES['Business Associate'].obj.Project  = P(0,0,0,0);
    PROFILES['Business Associate'].obj.Report   = P(0,0,0,0);
    PROFILES['Business Associate'].act.export   = 0;
  }
  // admins keep everything
  PROFILES['System Administrator'].act.manageAssignment = 1;
  PROFILES['System Administrator'].act.manageShares     = 1;
  PROFILES['Branch Head'].act.manageShares              = 1;
  PROFILES['CEO'].act.manageShares                      = 1;
})();

/* a friendly explanation of what a department may touch (used in the UI) */
function V6_editableObjects(){
  const p = prof();
  return Object.keys(p.obj).filter(o=>p.obj[o].e);
}

/* ============================================================================
   2 · USER RECORD UPGRADES — BA code + password lifecycle
   ========================================================================== */
(function V6_upgradeUsers(){
  let n = 1;
  /* deterministic 10-digit mobile from the username, so demo users have a plausible number */
  const genMob = (seed)=>{ let h=0; for(const ch of seed) h=(h*31+ch.charCodeAt(0))>>>0;
    return '9'+String(h).padStart(9,'0').slice(0,9); };
  USERS.forEach(u=>{
    u.pwdChangedAt = u.pwdChangedAt || new Date(Date.now() - 5*86400000).toISOString();
    u.mustChange   = !!u.mustChange;
    u.loginType    = u.loginType || 'Primary';
    if (u.profile === 'Business Associate' && !u.baCode) u.baCode = 'BA-' + String(1000 + (n++));
    u.active = u.active !== false;
    /* every account now carries an email + mobile */
    if(!u.email)  u.email  = u.u + '@inframantra.com';
    if(!u.mobile) u.mobile = genMob(u.u);
  });
  // demo: make one user's password already expired so the flow is visible
})();
const V6_bas = () => USERS.filter(u=>u.profile==='Business Associate');
function V6_baCode(name){ const u = USERS.find(x=>x.n===name); return u ? (u.baCode||'') : ''; }

/* password age helpers */
function V6_pwdAgeDays(u){ return Math.floor((Date.now() - new Date(u.pwdChangedAt).getTime())/86400000); }
function V6_pwdDaysLeft(u){ return V6.sec.pwdDays - V6_pwdAgeDays(u); }

/* ============================================================================
   3 · RECORD SHARING — hierarchy (already there) + manual shares + share rules
       mine() is re-pointed so every list, detail and report honours it.
   ========================================================================== */
function V6_sharedToMe(kind, id){
  if(!ME) return null;
  const s = V6.shares.find(x=>x.kind===kind && x.id===id &&
     (x.to===ME.n || x.to==='Profile: '+ME.profile || x.to==='Dept: '+prof().dept || x.to==='Everyone'));
  return s || null;
}
function V6_shareAccess(kind, id){ const s = V6_sharedToMe(kind,id); return s ? s.access : ''; }

const V6_mineBase = mine;
window.mine = function(rec, kind){
  if(!ME) return false;
  if(V6_sharedToMe(kind, rec.id)) return true;       // explicitly shared with me
  return V6_mineBase(rec, kind);                     // BA rule + grants + hierarchy subtree
};

/* can I edit THIS record? object permission + share access + record locks */
function V6_canEdit(kind, rec){
  if(!ME) return false;
  if(rec && kind==='Deal' && rec.stage==='Closed Lost') return false;
  if(V6_shareAccess(kind, rec && rec.id) === 'edit') return true;
  return can('e', kind);
}
window.V6_canEdit = V6_canEdit;

/* share a record with a person / profile / department */
function V6_shareRec(kind, id){
  const targets = ['Everyone', ...DEPTS.map(d=>'Dept: '+d), ...Object.keys(PROFILES).map(p=>'Profile: '+p), ...USERS.map(u=>u.n)];
  const existing = V6.shares.filter(s=>s.kind===kind && s.id===id);
  modal('Share ' + kind + ' ' + id, `
    <div class="f2">
      <div class="fg"><label class="f">Share with <span>*</span></label>
        <select id="sh_to" class="inp">${optsB(targets)}</select></div>
      <div class="fg"><label class="f">Access</label>
        <select id="sh_ac" class="inp">${opts(['read','edit'])}</select></div>
    </div>
    <div class="fg"><label class="f">Reason / note</label><input id="sh_n" class="inp" placeholder="e.g. covering while RM is on leave"></div>
    ${existing.length ? `<div class="sec"><div class="sh"><i class="fa-solid fa-user-group"></i> Already shared with</div>
      <div class="sb" style="grid-template-columns:1fr;padding-top:8px">
      ${existing.map((s,i)=>`<div class="fr"><span class="k">${esc(s.to)} · <b>${esc(s.access)}</b></span>
        <span class="v"><button class="btn btn-d btn-s" onclick="V6_unshare('${esc(s.id)}','${esc(s.kind)}','${esc(s.to)}')">Remove</button></span></div>`).join('')}
      </div></div>` : ''}
    <p class="hint">Hierarchy access is automatic — a Team Leader already sees their team, a Branch Head sees every TL below them. Use this only for one-off access outside the tree.</p>`,
   ()=>{
     const to = el('sh_to').value; if(!to) return toast('Pick who to share with','fa-triangle-exclamation');
     V6.shares.push({kind, id, to, access: el('sh_ac').value, by: ME.n, at: V6_now(), note: el('sh_n').value.trim()});
     closeModal(); toast('Shared with ' + to); render();
   }, 'Share');
}
function V6_unshare(id, kind, to){
  V6.shares = V6.shares.filter(s=>!(s.id===id && s.kind===kind && s.to===to));
  closeModal(); toast('Sharing removed'); render();
}

/* ============================================================================
   4 · LEAD ASSIGNMENT RULES  (owned by the Pre-Sales Team Leader)
       Rule = criteria (project / city / budget / source / campaign / BA)
              → an assignment method (round robin across a pool, or one owner)
       First matching rule (by order) wins. Falls back to the old round robin.
   ========================================================================== */
function V6_seedRules(){
  if(V6.rules.length) return;
  const pre = USERS.filter(u=>PROFILES[u.profile] && PROFILES[u.profile].dept==='Pre Sales' && u.profile!=='Pre-Sales Team Leader').map(u=>u.n);
  V6.rules.push({
    id:V6_uid('R'), name:'Dwarka Expressway · high budget → senior desk', active:true,
    when:{ project:'Whiteland Westin Residences', city:'', budget:'> 5 Cr', source:'', campaign:'' },
    method:'roundrobin', pool: pre.slice(0,2).length ? pre.slice(0,2) : pre, owner:'', by:'Meraj Varid', at:V6_now()
  });
  V6.rules.push({
    id:V6_uid('R'), name:'All 99acres leads → pre-sales round robin', active:true,
    when:{ project:'', city:'', budget:'', source:'99 acres', campaign:'' },
    method:'roundrobin', pool: pre, owner:'', by:'Meraj Varid', at:V6_now()
  });
}
function V6_ruleMatches(rule, lead){
  const w = rule.when || {};
  const eq = (a,b) => !a || String(a).toLowerCase() === String(b||'').toLowerCase();
  return eq(w.project, lead.project) && eq(w.city, lead.city) && eq(w.budget, lead.budget) &&
         eq(w.source, lead.source)  && eq(w.campaign, lead.campaign);
}
/* returns {owner, rule} */
function V6_assignOwner(lead){
  const rule = V6.rules.filter(r=>r.active).find(r=>V6_ruleMatches(r, lead));
  if(!rule) return { owner:'', rule:null };
  if(rule.method === 'owner' && rule.owner) return { owner: rule.owner, rule };
  const pool = (rule.pool||[]).filter(n=>USERS.some(u=>u.n===n));
  if(!pool.length) return { owner:'', rule };
  const i = (V6.rr[rule.id] || 0) % pool.length;
  V6.rr[rule.id] = i + 1;
  return { owner: pool[i], rule };
}
window.V6_assignOwner = V6_assignOwner;

function V6_ruleForm(idx){
  const r = idx==null ? {name:'',active:true,when:{project:'',city:'',budget:'',source:'',campaign:''},method:'roundrobin',pool:[],owner:''} : V6.rules[idx];
  const people = USERS.filter(u=>PROFILES[u.profile] && ['Pre Sales','Sales'].includes(PROFILES[u.profile].dept)).map(u=>u.n);
  modalWide(idx==null ? 'New assignment rule' : 'Edit assignment rule', `
    <div class="fg"><label class="f">Rule name <span>*</span></label>
      <input id="ar_n" class="inp" value="${esc(r.name)}" placeholder="e.g. Gurgaon · Facebook · 2-3.5 Cr → Anup"></div>
    <div class="sec"><div class="sh"><i class="fa-solid fa-filter"></i> When a new customer matches ALL of</div>
      <div class="sb" style="grid-template-columns:1fr 1fr 1fr;padding-top:10px">

const V6_TOKEN_KEY = 'im_crm_token';
let V6_idleTimer = null;

function V6_issueToken(user){
  const tok = { t: V6_uid('TK'), u: user.u, iss: Date.now(), last: Date.now() };
  try { localStorage.setItem(V6_TOKEN_KEY, JSON.stringify(tok)); } catch(e){}
  return tok;
}
function V6_touch(){
  try{
    const raw = localStorage.getItem(V6_TOKEN_KEY); if(!raw) return;
    const tok = JSON.parse(raw); tok.last = Date.now();
    localStorage.setItem(V6_TOKEN_KEY, JSON.stringify(tok));
  }catch(e){}
}
function V6_clearToken(){ try{ localStorage.removeItem(V6_TOKEN_KEY); }catch(e){} }
function V6_readToken(){
  try{ const raw = localStorage.getItem(V6_TOKEN_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
/* refresh keeps you signed in; 30 minutes of no activity signs you out */
function V6_idleCheck(){
  const tok = V6_readToken(); if(!tok || !ME) return;
  const idleMs = Date.now() - tok.last;
  if(idleMs > V6.sec.idleMins * 60000){
    V6_clearToken();
    toast('Signed out after ' + V6.sec.idleMins + ' minutes of inactivity','fa-clock');
    logout();
  }
}
['click','keydown','mousemove','scroll','touchstart'].forEach(ev=>
  document.addEventListener(ev, ()=>{ if(ME) V6_touch(); }, {passive:true}));
setInterval(V6_idleCheck, 20000);

/* ============================================================================
   EMAIL (client-side simulation)
   Everything queues into V6.outbox. To send for real, replace the body of
   V6_deliverMail() with a fetch() to your mail service / backend endpoint —
   e.g. POST /api/mail  { to, subject, body }. Nothing else needs to change.
   ========================================================================== */
function V6_genPassword(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ', a='abcdefghijkmnpqrstuvwxyz', d='23456789', s='@#$%&*';
  const pick=set=>set[Math.floor(Math.random()*set.length)];
  let base=[pick(A),pick(A),pick(a),pick(a),pick(a),pick(d),pick(d),pick(d),pick(s)];
  for(let i=base.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[base[i],base[j]]=[base[j],base[i]];}
  return base.join('');
}
function V6_deliverMail(mail){
  /* ▼▼▼ WIRE A REAL EMAIL SERVICE HERE ▼▼▼
     return fetch('/api/mail',{method:'POST',headers:{'Content-Type':'application/json'},
       body:JSON.stringify({to:mail.to,subject:mail.subject,body:mail.body})});
     ▲▲▲ Until then, we just record it as "sent" locally. */
  return Promise.resolve({ ok:true, simulated:true });
}
function V6_sendMail(mail){
  const rec = { id:V6_uid('MAIL'), to:mail.to, name:mail.name||'', subject:mail.subject, body:mail.body,
                at:V6_now(), status:'queued' };
  if(!V6.outbox) V6.outbox=[];
  V6.outbox.unshift(rec);
  V6_deliverMail(mail).then(r=>{ rec.status = r&&r.ok ? (r.simulated?'sent (simulated)':'sent') : 'failed'; })
                      .catch(()=>{ rec.status='failed'; });
  return rec;
}
/* preview a queued welcome/reset mail on screen */
function V6_showMail(id){

  modal('Email · ' + m.subject, `

/* ============================================================================
   7 · ACTIVITY ENGINE v6
       · Conduct = photo + live GPS, mandatory for F2F / Site Visit / Re-visit / FN
       · Every activity is a real record you can open (created / conducted /
         by whom / edited by / photo / location)
       · A planned activity that is missed pushes the deal back a stage and
         stamps a sub-status (… Scheduled → … Missed)
   ========================================================================== */

/* sub-status vocabulary: scheduled vs conducted vs missed, per stage */
SUBSTATUS['Meeting']    = ['F2F Scheduled','F2F Conducted','VC Scheduled','VC Conducted','Meeting Missed','Meeting Cancelled'];
SUBSTATUS['Site Visit'] = ['First SV Scheduled','First SV Conducted','Re-visit Scheduled','Re-visit Conducted','SV Missed','SV Cancelled'];
SUBSTATUS['FN']         = ['FN Scheduled','FN Conducted','Negotiation in progress','Offer shared','Token awaited','FN Missed'];
SUBSTATUS['Working']    = ['Follow up','Interested','Not reachable','Attempted'];

/* which activities demand proof-of-visit (live photo + GPS):
   ONLY F2F meetings, Site Visits, Re-visits and Final Negotiations.
   Plain Calls and VC (video-call) meetings do NOT capture photo/location. */
function V6_needsProof(task){
  const type = (typeof task === 'string' ? task : (task && task.type) || '');
  const sub  = (typeof task === 'object' && task ? String(task.subtype || '') : '').toLowerCase();
  if(type === 'Site Visit')  return true;                 // First SV + Re-visit
  if(type === 'FN' || type === 'Final Negotiation') return true;
  if(type === 'Meeting')     return !sub.includes('vc');  // F2F yes, VC no
  if(type === 'F2F' || type === 'Re-visit') return true;
  return false;                                            // Call, WhatsApp, Email, Task…
}

/* activity type → the sub-status to stamp once it is conducted */
function V6_conductedSub(task){
  const sub = (task.subtype || '').toLowerCase();
  if(task.type === 'Meeting')    return sub.includes('vc') ? 'VC Conducted' : 'F2F Conducted';
  if(task.type === 'Site Visit') return sub.includes('re')  ? 'Re-visit Conducted' : 'First SV Conducted';
  if(task.type === 'FN')         return 'FN Conducted';
  return '';
}
function V6_missedSub(type){
  return { Meeting:'Meeting Missed', 'Site Visit':'SV Missed', FN:'FN Missed' }[type] || '';
}

/* ---- geolocation ---------------------------------------------------------- */
let V6_geo = null;
function V6_captureGeo(){
  const out = document.getElementById('cd_geo');
  if(out) out.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Getting your location…';
  if(!navigator.geolocation){
    if(out) out.innerHTML = '<span style="color:var(--bad)">This browser has no GPS. Type the location manually below.</span>';
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos=>{
      V6_geo = { lat:+pos.coords.latitude.toFixed(6), lng:+pos.coords.longitude.toFixed(6),
                 acc: Math.round(pos.coords.accuracy), at: V6_now() };
      if(out) out.innerHTML = `<span style="color:var(--ok)"><i class="fa-solid fa-location-crosshairs"></i>
        ${V6_geo.lat}, ${V6_geo.lng} · ±${V6_geo.acc} m</span>
        <a class="lnk" target="_blank" href="https://maps.google.com/?q=${V6_geo.lat},${V6_geo.lng}">Open in Maps</a>`;
    },
    err=>{
      if(out) out.innerHTML = `<span style="color:var(--bad)"><i class="fa-solid fa-triangle-exclamation"></i>
        Location blocked (${esc(err.message)}). Allow location, or type where the activity happened.</span>`;
    },
    { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
  );
}
let V6_photo = null;
let V6_camStream = null;

/* ---- LIVE CAMERA (getUserMedia) — real-time capture only, never the gallery ---- */
async function V6_camStart(){
  const video = document.getElementById('cd_video');
  const pv    = document.getElementById('cd_pv');
  if(!video) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
    return toast('This device/browser has no camera access','fa-triangle-exclamation');
  try{
    V6_camStop();
    /* facingMode:'environment' = rear camera on phones; falls back to any camera on laptops */
    V6_camStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' } }, audio:false });
    video.srcObject = V6_camStream;
    video.style.display = 'block';
    if(pv) pv.style.display = 'none';
    const snap=document.getElementById('cd_snapBtn'), camBtn=document.getElementById('cd_camBtn'),
          retake=document.getElementById('cd_retakeBtn');
    if(snap)   snap.style.display   = 'inline-flex';
    if(camBtn) camBtn.style.display = 'none';
    if(retake) retake.style.display = 'none';
  }catch(e){
    toast(e && e.name==='NotAllowedError' ? 'Camera permission denied — allow it to capture proof'
          : 'Could not open the camera','fa-triangle-exclamation');
  }
}
function V6_camSnap(){
  const video = document.getElementById('cd_video'); if(!video || !V6_camStream) return;
  const w = video.videoWidth||640, h = video.videoHeight||480;
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d'); ctx.drawImage(video,0,0,w,h);
  /* stamp date/time onto the frame so the proof carries its own timestamp */
  const stamp = new Date().toLocaleString('en-IN');
  ctx.font = Math.round(h/28)+'px sans-serif';
  const tw = ctx.measureText(stamp).width;
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(8,h-Math.round(h/22)-14,tw+16,Math.round(h/22)+10);
  ctx.fillStyle='#fff'; ctx.fillText(stamp,16,h-16);
  const data = cv.toDataURL('image/jpeg',0.85);
  V6_photo = { data, name:'live-capture.jpg', at:V6_now(), live:true };
  V6_camStop();
  const video2=document.getElementById('cd_video'); if(video2) video2.style.display='none';
  const pv=document.getElementById('cd_pv');
  if(pv){ pv.style.display='block';
    pv.innerHTML = `<img src="${data}" style="max-height:220px;width:100%;object-fit:contain;border-radius:10px;border:1px solid var(--line)">
      <div class="mini" style="margin-top:4px"><i class="fa-solid fa-circle-check" style="color:var(--ok)"></i> Live photo captured · ${esc(stamp)}</div>`; }
  const snap=document.getElementById('cd_snapBtn'), camBtn=document.getElementById('cd_camBtn'),
        retake=document.getElementById('cd_retakeBtn');
  if(snap)   snap.style.display   = 'none';
  if(camBtn) camBtn.style.display = 'none';
  if(retake) retake.style.display = 'inline-flex';
}
function V6_camStop(){
  if(V6_camStream){ V6_camStream.getTracks().forEach(t=>t.stop()); V6_camStream=null; }
  const video=document.getElementById('cd_video'); if(video) video.srcObject=null;
}

          <div id="cd_pv" class="mini" style="padding:22px;text-align:center;border:1px dashed var(--line);border-radius:10px">

function V6_finishConduct(t, f){
  const at = V6_now();
  t.status      = 'Conducted';
  t.doneAt      = at;
  t.conductedBy = ME.n;
  t.outcome     = f.outcome;
  t.dur         = f.dur;
  t.noteDone    = f.note;
  t.photo       = V6_photo ? V6_photo.data : '';
  t.photoName   = V6_photo ? V6_photo.name : '';
  t.geo         = V6_geo;
  t.place       = f.place;
  t.editedBy    = ME.n;
  t.editedAt    = at;

  const d = byId(DB.deals, t.dealId), c = byId(DB.customers, t.custId);
  [d, c].forEach(r=>{
    if(!r) return;
    const a = r.activities.find(a=>a.taskId === t.id);
    const patch = { status:'Conducted', doneAt:at, conductedBy:ME.n, outcome:f.outcome, dur:f.dur,
                    photo:t.photo, photoName:t.photoName, geo:t.geo, place:f.place,
                    noteDone:f.note, editedBy:ME.n, editedAt:at };
    if(a) Object.assign(a, patch);
    else  r.activities.unshift({ t:t.type, by:t.owner, at, note:f.note || t.type, taskId:t.id, ...patch });
    r.audit.unshift({ field:t.type + ' activity', old:'Scheduled', new:'Conducted' + (t.geo ? ' @ ' + t.geo.lat + ',' + t.geo.lng : ''),
                      by:ME.n, at });
    r.updatedAt = at; r.lastModifiedBy = ME.n;
  });

  if(d){
    const sub = V6_conductedSub(t);
    if(sub){ audit(d, 'DealSubstatus', d.substatus, sub); d.substatus = sub; }
  }
  if(f.nextDate && d){
    addTask({ type:t.type === 'FN' ? 'FN' : 'Call', date:f.nextDate, time:f.nextTime, dealId:d.id, custId:d.custId,
              project:d.projectSales, owner:ME.n, meta:'Follow-up after ' + t.type });
  }
  closeModal(); buildNav(); toast(t.type + ' conducted — photo & location stamped','fa-circle-check'); render();
}

/* ---- MISSED ACTIVITY SWEEP — roll the deal back one stage ------------------ */
const V6_STAGE_BACK = { 'Meeting':'Working', 'Site Visit':'Meeting', 'FN':'Site Visit' };
function V6_missedSweep(){
  if(!ME) return;
  const today = iso(now());
  DB.tasks.forEach(t=>{
    if(t.status !== 'Scheduled' || t.missedHandled) return;
    if(!(t.date < today)) return;                       // still due today or later
    if(!['Meeting','Site Visit','FN'].includes(t.type)) return;

    t.missedHandled = true;
    t.status = 'Missed';
    const d = byId(DB.deals, t.dealId);
    const c = byId(DB.customers, t.custId);
    const at = V6_now();

    [d, c].forEach(r=>{
      if(!r) return;
      const a = r.activities.find(a=>a.taskId === t.id);
      if(a){ a.status = 'Missed'; a.missed = true; a.editedBy = 'System'; a.editedAt = at; }
      r.audit.unshift({ field:t.type + ' activity', old:'Scheduled', new:'Missed (not conducted on ' + fdate(t.date) + ')', by:'System', at });
    });

    if(d && !['Closed Won','Closed Lost'].includes(d.stage)){
      const back = V6_STAGE_BACK[d.stage === t.type ? d.stage : t.type];
      const sub  = V6_missedSub(t.type);
      if(back && d.stage === t.type){
        audit(d, 'Deal Stage', d.stage, back);
        d.stage = back;
      }
      if(sub){ audit(d, 'DealSubstatus', d.substatus, sub); d.substatus = sub; }
      notify([d.owner, d.tl], `${t.type} on ${fdate(t.date)} was not conducted — ${d.id} moved back to ${d.stage} (${sub})`,
             { type:'deal', id:d.id }, 'fa-rotate-left');
    }
  });
}
setInterval(V6_missedSweep, 60000);

  t.createdBy = ME ? ME.n : 'System';
  t.createdAt = t.createdAt || V6_now();
  t.subtype   = o.subtype || o.meta || '';
  /* stamp the "… Scheduled" sub-status on the deal */
  const d = byId(DB.deals, o.dealId);
  if(d){
    const sub = { Meeting: /vc/i.test(t.subtype) ? 'VC Scheduled' : 'F2F Scheduled',
                  'Site Visit': /re-?visit/i.test(t.subtype) ? 'Re-visit Scheduled' : 'First SV Scheduled',
                  FN: 'FN Scheduled' }[o.type];
    if(sub){ audit(d, 'DealSubstatus', d.substatus, sub); d.substatus = sub; }

};

/* ============================================================================
   8 · CUSTOMER DEDUPE — one customer, for ever.
       Mobile OR e-mail matches → the existing record is UPDATED (never forked),
       and every changed field lands in the history.
   ========================================================================== */
function V6_findDup(mobile, email){
  const mob = String(mobile||'').replace(/\D/g,'').slice(-10);
  if(mob){ const m = byMobile(mob); if(m) return m; }
  const em = String(email||'').trim().toLowerCase();
  if(em){ const e = DB.customers.find(c=>(c.email||'').toLowerCase() === em); if(e) return e; }
  return null;
}
window.V6_findDup = V6_findDup;

/* merge fresh values into an existing customer, writing history for each change */
function V6_mergeCustomer(c, raw, srcLabel){
  const at = V6_now();
  const map = { name:'Customer Name', mobile:'Mobile', email:'Email', campaign:'Campaign', source:'Source',
    subSource:'Sub Source', projectMkt:'Project(Marketing)', cityMkt:'City(Marketing)', budgetMkt:'Budget Range(Marketing)',
    projectMRC:'Project(MRC)', budgetMRC:'Budget Range(MRC)', cityMRC:'City(MRC)', configMRC:'Configuration(MRC)' };
  let changed = 0;
  Object.keys(map).forEach(k=>{
    const v = raw[k];
    if(v == null || v === '' ) return;
    if(String(c[k]||'') === String(v)) return;
    c.audit.unshift({ field: map[k], old: c[k] || '', new: v, by: srcLabel || (ME ? ME.n : 'Lead Capture'), at });
    c[k] = v; changed++;
  });
  /* remember every source this customer has ever come from */
  c.sourceLog = c.sourceLog || [];
  if(raw.source) c.sourceLog.unshift({ source: raw.source, campaign: raw.campaign||'', subSource: raw.subSource||'',
                                       project: raw.projectMkt || raw.project || '', at, via: srcLabel || 'Lead Capture' });
  c.enquiryCount = (c.enquiryCount || 1) + 1;
  c.updatedAt = at;
  return changed;
}
window.V6_mergeCustomer = V6_mergeCustomer;

/* the single funnel every new lead goes through (portal, webhook, import, manual) */
function V6_upsertLead(raw, via){
  via = via || 'Lead Capture';
  const at  = V6_now();
  const mob = String(raw.mobile||'').replace(/\D/g,'').slice(-10);
  const dup = V6_findDup(mob, raw.email);

  if(dup){
    V6_mergeCustomer(dup, { ...raw, mobile: mob || dup.mobile }, via);
    dup.activities.unshift({ t:'Call', outcome:'Re-enquiry captured', by:via, at, status:'Conducted',
      note:'Repeat enquiry via ' + via + (raw.projectMkt||raw.project ? ' — ' + (raw.projectMkt||raw.project) : '') });
    if(dup.stage === 'Abort' || dup.stage === 'Hold'){
      dup.audit.unshift({ field:'Lead Status', old:dup.stage, new:'Re-engage', by:via, at });
      dup.stage = dup.leadStatus = 'Re-engage';
    }
    dup.reengage = iso(now());
    reindex();
    return { dup:true, rec:dup };
  }

  const lead = { project: raw.projectMkt || raw.project || '', city: raw.cityMkt || raw.city || '',
                 budget: raw.budgetMkt || raw.budget || '', source: raw.source || '', campaign: raw.campaign || '' };
  const asg = V6_assignOwner(lead);
  const owner = raw.owner || asg.owner || nextOwner();

  const c = newCustObj({
    name: raw.name || 'Unknown', mobile: mob, email: raw.email || '',
    campaign: raw.campaign || '', source: raw.source || '', subSource: raw.subSource || '',
    projectMkt: lead.project, cityMkt: lead.city || 'Gurgaon', budgetMkt: lead.budget,
    projectMRC: lead.project, cityMRC: lead.city || 'Gurgaon', budgetMRC: lead.budget,
    owner, manager: (USERS.find(u=>u.n === owner) || {}).manager || '',
    stage:'New', leadStatus:'New', ba: raw.ba || '', baCode: raw.ba ? V6_baCode(raw.ba) : ''
  });
  c.sourceLog   = raw.source ? [{ source: raw.source, campaign: raw.campaign||'', subSource: raw.subSource||'', project: lead.project, at, via }] : [];
  c.enquiryCount = 1;
  c.assignedByRule = asg.rule ? asg.rule.name : 'Default round robin';
  c.audit.unshift({ field:'Customer Owner', old:'', new: owner, by: via + ' · ' + c.assignedByRule, at });
  DB.customers.unshift(c); idxAdd(DB.customers, c); reindex();
  V6_logOwner('Customer', c.id, '', owner, via + ' · ' + c.assignedByRule);
  notify([owner, (USERS.find(u=>u.n === owner)||{}).manager], 'New lead assigned: ' + c.name + ' (' + (c.source||via) + ')',
         { type:'customer', id:c.id }, 'fa-user-plus');
  return { dup:false, rec:c };
}
window.V6_upsertLead = V6_upsertLead;

/* v5's portal ingest now runs through the v6 funnel (dedupe + assignment rules) */
window.ingestLead = function(raw, ch, acc){
  const M = (acc && acc.map) || {};
  return V6_upsertLead({
    name: raw.name, mobile: raw.mobile, email: raw.email,
    campaign: raw.campaign || M.campaign || '', source: (ch && ch.source) || raw.source || '',
    subSource: raw.subSource || M.subSource || '',
    projectMkt: raw.project || M.project || '', cityMkt: raw.city || M.city || '',
    budgetMkt: raw.budget || M.budget || '', owner: M.owner || ''
  }, (ch ? ch.n : 'Portal') + (acc ? ' · ' + acc.label : ''));
};

   9 · LIST VIEW ENGINE v6  (Customers + Deals)
       serial numbers · sort on any column · add/remove columns ·
       filter on ANY field · clone a view · save it private / for everyone /
       for one person / for a profile · pin it to the top
   ========================================================================== */

/* extra columns the business asked for */
[['baCode','BA Code'],['ba','Business Associate'],['enquiryCount','Times enquired'],
 ['assignedByRule','Assigned by rule'],['firstAttempted','First attempt'],['firstConnected','First connect'],
 ['callDispositionTime','Call disposition time'],['leadStatus','Lead Status (raw)'],['manager','Reporting Manager'],
 ['updatedAt','Last Modified'],['lastModifiedBy','Last Modified By'],['configMkt','Configuration(Marketing)'],
 ['propTypeMkt','Property Type(Marketing)'],['type','Customer Type'],['abortReason','Abort Reason'],
 ['substatus','Sub Status']
].forEach(c=>{ if(!C_COLS.some(x=>x[0]===c[0])) C_COLS.push(c); });

[['substatus','DealSubstatus'],['rm','RM Name'],['updatedAt','Last Modified'],['lastModifiedBy','Last Modified By'],
 ['lostReason','Lost Reason'],['bookingValue','Booking Value'],['firstAttempted','First attempt'],
 ['firstConnected','First connect'],['baCode','BA Code']
].forEach(c=>{ if(!D_COLS.some(x=>x[0]===c[0])) D_COLS.push(c); });

const V6_LS = {
  c: { sort:{ k:'createdAt', dir:'desc' }, filters:[], view:null },
  d: { sort:{ k:'createdAt', dir:'desc' }, filters:[], view:null }
};
const V6_OPS = ['equals','not equals','contains','does not contain','starts with','is empty','is not empty','greater than','less than','between'];

function V6_meta(t){
  return t === 'c'
    ? { kind:'Customer', cols:C_COLS, show:()=>C_SHOW, setShow:v=>{C_SHOW=v;}, src:()=>scope(DB.customers,'Customer'),
        cell:cellC, open:'customer', pg:()=>C_PG, setPg:v=>{C_PG=v;}, label:'Customers' }
    : { kind:'Deal', cols:D_COLS, show:()=>D_SHOW, setShow:v=>{D_SHOW=v;}, src:()=>scope(DB.deals,'Deal'),
        cell:cellD, open:'deal', pg:()=>D_PG, setPg:v=>{D_PG=v;}, label:'Deals' };
}
/* value of any field, including fields that live on the parent customer */
function V6_val(t, r, k){
  if(t === 'd'){
    const c = byId(DB.customers, r.custId) || {};
    if(k === 'cust')   return c.name || '';
    if(k === 'mobile') return c.mobile || '';
    if(k === 'custId') return c.id || '';
    if(k === 'baCode') return c.baCode || V6_baCode(c.ba) || '';
  }
  const v = r[k];
  return v == null ? '' : v;
}
function V6_cmpOp(v, op, a, b){
  const s = String(v ?? '').toLowerCase(), x = String(a ?? '').toLowerCase();
  switch(op){
    case 'equals':          return s === x;
    case 'not equals':      return s !== x;
    case 'contains':        return s.includes(x);
    case 'does not contain':return !s.includes(x);
    case 'starts with':     return s.startsWith(x);
    case 'is empty':        return !s;
    case 'is not empty':    return !!s;
    case 'greater than':    return (isNaN(+v) ? s > x : +v > +a);
    case 'less than':       return (isNaN(+v) ? s < x : +v < +a);
    case 'between':         return s >= x && s <= String(b ?? '').toLowerCase();
    default: return true;
  }
}
function V6_filterRows(t, rows){
  const F = V6_LS[t].filters;
  if(!F.length) return rows;
  return rows.filter(r => F.every(f => V6_cmpOp(V6_val(t, r, f.field), f.op, f.a, f.b)));
}
function V6_sortRows(t, rows){
  const s = V6_LS[t].sort;
  if(!s || !s.k) return rows;
  const dir = s.dir === 'asc' ? 1 : -1;
  return rows.slice().sort((p,q)=>{
    let a = V6_val(t, p, s.k), b = V6_val(t, q, s.k);
    const na = +a, nb = +b;
    if(a !== '' && b !== '' && !isNaN(na) && !isNaN(nb)) return (na - nb) * dir;
    a = String(a).toLowerCase(); b = String(b).toLowerCase();
    return a < b ? -dir : a > b ? dir : 0;
  });
}
function V6_sortBy(t, k){
  const s = V6_LS[t].sort;
  if(s.k === k) s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  else { s.k = k; s.dir = 'asc'; }
  V6_meta(t).setPg(0); render();
}

/* ---- filter builder ------------------------------------------------------- */
function V6_filterBuilder(t){
  const m = V6_meta(t);
  const rowHtml = (f, i) => `<div class="v6-frow" data-i="${i}">
      <select class="inp v6-ff">${m.cols.map(([k,l])=>`<option value="${k}" ${f.field===k?'selected':''}>${esc(l)}</option>`).join('')}</select>
      <select class="inp v6-fo">${V6_OPS.map(o=>`<option ${f.op===o?'selected':''}>${o}</option>`).join('')}</select>
      <input class="inp v6-fa" value="${esc(f.a||'')}" placeholder="value">
      <input class="inp v6-fb" value="${esc(f.b||'')}" placeholder="…and (for between)">
      <button class="btn btn-d btn-s" onclick="this.closest('.v6-frow').remove()"><i class="fa-solid fa-xmark"></i></button>
    </div>`;
  modalWide('Filters — ' + m.label, `
    <p class="hint" style="margin:0 0 10px"><i class="fa-solid fa-filter"></i>
      Filter on <b>any</b> field on the object — marketing, MRC, sales, activity or audit fields. Rows must match every filter.</p>
    <div id="v6_filters">${(V6_LS[t].filters.length ? V6_LS[t].filters : [{field:m.cols[0][0],op:'equals',a:'',b:''}]).map(rowHtml).join('')}</div>
    <button class="btn btn-o btn-s" style="margin-top:8px" onclick="V6_addFilterRow('${t}')"><i class="fa-solid fa-plus"></i> Add filter</button>`,
   ()=>{
     const out = [];
     document.querySelectorAll('#v6_filters .v6-frow').forEach(r=>{
       const field = r.querySelector('.v6-ff').value, op = r.querySelector('.v6-fo').value;
       const a = r.querySelector('.v6-fa').value.trim(), b = r.querySelector('.v6-fb').value.trim();
       if(!field) return;
       if(!a && !['is empty','is not empty'].includes(op)) return;
       out.push({field, op, a, b});
     });
     V6_LS[t].filters = out; V6_meta(t).setPg(0);
     closeModal(); toast(out.length ? out.length + ' filter' + (out.length===1?'':'s') + ' applied' : 'Filters cleared'); render();
   }, 'Apply filters');
}
function V6_addFilterRow(t){
  const m = V6_meta(t);
  const box = document.getElementById('v6_filters');
  const d = document.createElement('div');
  d.className = 'v6-frow';
  d.innerHTML = `<select class="inp v6-ff">${m.cols.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('')}</select>
    <select class="inp v6-fo">${V6_OPS.map(o=>`<option>${o}</option>`).join('')}</select>
    <input class="inp v6-fa" placeholder="value"><input class="inp v6-fb" placeholder="…and (for between)">
    <button class="btn btn-d btn-s" onclick="this.closest('.v6-frow').remove()"><i class="fa-solid fa-xmark"></i></button>`;
  box.appendChild(d);
}

function V6_saveView(t, cloneOf){

/* cell: reuse v5 renderers, fall back for the new fields */
function V6_cell(t, r, k, m){
  const known = (t === 'c' ? C_COLS : D_COLS);
  try{
    const base = m.cell(r, k);
    if(base !== undefined && base !== null && base !== '' && base !== '—') return base;
  }catch(e){}
  let v = V6_val(t, r, k);
  if(k === 'baCode' && !v && r.ba) v = V6_baCode(r.ba);
  if(/At$|Attempted$|Connected$|Time$/.test(k) && v) v = fdt(v);
  return esc(v) || '—';

/* ============================================================================
   10 · GENERIC TABLE ENHANCER — every other list (Bookings / Post Sales /
        Projects / Tasks / Activities) gets serial numbers + click-to-sort,
        without touching their v5 render code.
   ========================================================================== */
function V6_enhanceTables(){
  document.querySelectorAll('#view table').forEach(tb=>{
    if(tb.classList.contains('v6-managed') || tb.dataset.v6) return;
    tb.dataset.v6 = '1';
    const head = tb.querySelector('thead tr');
    const body = tb.querySelector('tbody');
    if(!head || !body) return;
    const rows = [...body.querySelectorAll('tr')];
    if(rows.length && rows[0].querySelector('.empty')) return;

    /* serial number column */
    const th = document.createElement('th'); th.textContent = '#'; th.style.width = '44px';
    head.insertBefore(th, head.firstChild);
    rows.forEach((r,i)=>{
      const td = document.createElement('td');
      td.className = 'mono'; td.style.color = 'var(--muted)'; td.textContent = i + 1;
      r.insertBefore(td, r.firstChild);
    });

    /* sortable headers */
    [...head.children].forEach((h, ci)=>{
      if(ci === 0) return;
      h.style.cursor = 'pointer';
      h.title = 'Sort by this column';
      h.addEventListener('click', ()=>{
        const dir = h.dataset.dir === 'asc' ? 'desc' : 'asc';
        [...head.children].forEach(x=>{ delete x.dataset.dir; x.querySelectorAll('.v6-sa').forEach(s=>s.remove()); });
        h.dataset.dir = dir;
        const ic = document.createElement('i');
        ic.className = 'fa-solid fa-arrow-' + (dir === 'asc' ? 'up' : 'down') + ' v6-sa';
        ic.style.cssText = 'font-size:9px;margin-left:4px'; h.appendChild(ic);
        const rs = [...body.querySelectorAll('tr')];
        rs.sort((a,b)=>{
          const x = (a.children[ci] ? a.children[ci].innerText : '').trim();
          const y = (b.children[ci] ? b.children[ci].innerText : '').trim();
          const nx = parseFloat(x.replace(/[^\d.-]/g,'')), ny = parseFloat(y.replace(/[^\d.-]/g,''));
          const num = !isNaN(nx) && !isNaN(ny) && /\d/.test(x) && /\d/.test(y);
          const r = num ? nx - ny : x.toLowerCase().localeCompare(y.toLowerCase());
          return dir === 'asc' ? r : -r;
        });
        rs.forEach((r,i)=>{ body.appendChild(r); if(r.children[0]) r.children[0].textContent = i + 1; });
      });
    });
  });
}

        · every report = PIVOT (grouped summary) + DETAIL (row level)
        · call reports: dialled / connected / duration, by customer, deal, user
        · TAT reports: created → first attempt, created → first connect

const V6_DEPT_OBJ = { 'Pre Sales':'Customer', 'Sales':'Deal', 'Post Sales':'Booking' };

/* ---- helpers -------------------------------------------------------------- */
const V6_mins = (a,b) => (!a || !b) ? null : Math.round((new Date(b) - new Date(a)) / 60000);
function V6_fmtMins(m){
  if(m == null) return '—';
  if(m < 60) return m + 'm';
  const h = Math.floor(m/60), d = Math.floor(h/24);
  if(h < 48) return h + 'h ' + (m%60) + 'm';
  return d + 'd ' + (h%24) + 'h';
}
const V6_durMins = s => {
  const t = String(s||''); let m = 0;
  const h = t.match(/(\d+)\s*h/i), mi = t.match(/(\d+)\s*m/i), se = t.match(/(\d+)\s*s/i);
  if(h) m += +h[1]*60; if(mi) m += +mi[1]; if(se) m += +se[1]/60;
  return Math.round(m*10)/10;
};
const V6_isCall      = a => a.t === 'Call';
const V6_isConnected = a => /^Connected/i.test(a.outcome || '');

/* who may open a report — gated by the OBJECT the report is about, so a user
   only sees reports for objects they can read (booking reports for Finance,
   no customer reports for Sales / Post-Sales, etc.) */
function V6_reportVisible(r){
  if(!ME) return false;
  /* explicit share always wins */
  const shared = V6.reports.some(x=>x.id === r.id && (x.sharedWith||[]).some(t=>
    t === ME.n || t === 'Dept: ' + prof().dept || t === 'Profile: ' + ME.profile || t === 'everyone'));
  if(shared) return true;
  if(act('manageUsers')) return true;             // system admins / CEO see everything
  if(!can('r','Report')) return false;            // no Reports access at all
  /* the "Download history" audit report is admin-only */
  if(r.id === 'download_log') return act('manageUsers');
  /* cross-object management reports (owner change, BA leads) need management tier + object read */
  if(r.dept === 'Management') return prof().dept === 'Management' && can('r', r.obj || 'Customer');
  /* object-gated: a report about X is visible only to those who can read X */
  return r.obj ? can('r', r.obj) : (r.dept === prof().dept);
}
function V6_shareReport(id){
  const targets = ['everyone', ...DEPTS.map(d=>'Dept: '+d), ...Object.keys(PROFILES).map(p=>'Profile: '+p), ...USERS.map(u=>u.n)];
  let rec = V6.reports.find(x=>x.id === id);
  modal('Share report', `
    <div class="fg"><label class="f">Give access to</label><select id="rs_t" class="inp">${optsB(targets)}</select></div>
    <p class="hint">By default a report is only visible to its own department (Pre-Sales → customer reports, Sales → deal reports, Post-Sales → booking reports). Sharing overrides that.</p>
    ${rec && (rec.sharedWith||[]).length ? `<div class="sec"><div class="sh">Already shared with</div><div class="sb" style="grid-template-columns:1fr;padding-top:8px">
      ${rec.sharedWith.map(t=>`<div class="fr"><span class="k">${esc(t)}</span></div>`).join('')}</div></div>` : ''}`,
   ()=>{
     const t = el('rs_t').value; if(!t) return toast('Pick someone','fa-triangle-exclamation');
     if(!rec){ rec = { id, sharedWith:[], folder:'', by:ME.n }; V6.reports.push(rec); }
     rec.sharedWith = rec.sharedWith || []; rec.sharedWith.push(t);
     closeModal(); toast('Report shared with ' + t); render();
   }, 'Share');
}

/* ---- pivot + detail viewer ------------------------------------------------ */
let V6_curReport = null, V6_pivotKey = null;
function V6_runReport(id){
  const def = V6_REPORTS.find(r=>r.id === id); if(!def) return;
  if(!V6_reportVisible(def)) return toast('This report belongs to ' + def.dept + '. Ask for access in Settings → Reports.','fa-lock');
  const out = def.run();
  V6_curReport = { def, out };
  V6_pivotKey = out.pivotKey;
  V6_paintReport();
}
function V6_paintReport(){
  const { def, out } = V6_curReport;
  const rows = out.rows;
  const cols = rows.length ? Object.keys(rows[0]) : [];
  const key = V6_pivotKey || out.pivotKey;
  const agg = out.agg || 'sum';
  const valCol = out.pivotVal;

  /* pivot */
  const p = {};
  rows.forEach(r=>{
    const k = String(r[key] ?? '—') || '—';
    const b = p[k] = p[k] || { n:0, sum:0, cnt:0 };
    b.n++;
    const v = parseFloat(String(r[valCol]).replace(/[^\d.-]/g,''));
    if(!isNaN(v)){ b.sum += v; b.cnt++; }
  });
  const pivot = Object.entries(p).map(([k,b])=>({
    key:k, records:b.n,
    value: agg === 'count' ? b.n : agg === 'avg' ? (b.cnt ? Math.round(b.sum/b.cnt) : 0) : Math.round(b.sum)
  })).sort((a,b)=>b.value - a.value);
  const max = Math.max(1, ...pivot.map(x=>x.value));
  const aggLabel = agg === 'count' ? 'Records' : agg === 'avg' ? 'Avg ' + valCol : 'Total ' + valCol;

  modalWide(def.name, `
    <div class="pill-h" style="margin-bottom:10px">
      <span class="tag t-gold">${esc(def.obj)}</span><span class="tag">${esc(def.dept)}</span>
      <span class="tag">${rows.length} rows</span>
      <div style="flex:1"></div>
      <label class="mini">Pivot by</label>
      <select class="inp" style="max-width:190px" onchange="V6_pivotKey=this.value;V6_paintReport()">
        ${cols.map(c=>`<option ${c === key ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
      <button class="btn btn-o btn-s" onclick="V6_exportReport()"><i class="fa-solid fa-file-csv"></i> Export</button>
      <button class="btn btn-o btn-s" onclick="V6_subscribe('${def.id}')"><i class="fa-regular fa-envelope"></i> Subscribe</button>
      ${act('manageUsers') ? `<button class="btn btn-o btn-s" onclick="V6_shareReport('${def.id}')"><i class="fa-solid fa-share-nodes"></i> Share</button>` : ''}
    </div>

    <div class="card" style="margin-bottom:12px"><div class="card-h"><h3><i class="fa-solid fa-table-cells"></i>Pivot — ${esc(key)}</h3></div>
      <div class="tw"><table><thead><tr><th>#</th><th>${esc(key)}</th><th>Records</th><th>${esc(aggLabel)}</th><th style="width:35%">Share</th></tr></thead><tbody>
      ${pivot.map((r,i)=>`<tr style="cursor:default"><td class="mono">${i+1}</td><td><b>${esc(r.key)}</b></td>
        <td class="mono">${r.records}</td><td class="mono">${r.value.toLocaleString('en-IN')}</td>
        <td><div style="display:flex;align-items:center;gap:8px"><div style="flex:1;height:7px;background:var(--line-2);border-radius:4px;overflow:hidden">
          <div style="width:${Math.round(r.value/max*100)}%;height:100%;background:var(--gold)"></div></div>
          <span class="mini mono">${Math.round(r.value/max*100)}%</span></div></td></tr>`).join('')}
      </tbody></table></div></div>

    <div class="card"><div class="card-h"><h3><i class="fa-solid fa-list"></i>Detail (${rows.length})</h3></div>
      <div class="tw" style="max-height:420px;overflow:auto"><table><thead><tr><th>#</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${rows.length ? rows.slice(0,500).map((r,i)=>`<tr style="cursor:default"><td class="mono">${i+1}</td>${cols.map(c=>`<td>${esc(r[c] ?? '')}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="${cols.length+1}"><div class="empty">No data in your scope.</div></td></tr>`}
      </tbody></table></div>
      ${rows.length > 500 ? '<div class="card-b"><span class="mini">Showing the first 500 rows — export for the full set.</span></div>' : ''}
    </div>`, null, 'Close');
}
function V6_exportReport(){
  const { def, out } = V6_curReport;
  const rows = out.rows; if(!rows.length) return toast('Nothing to export','fa-circle-info');
  const cols = Object.keys(rows[0]);
  const csv = [['S.No', ...cols], ...rows.map((r,i)=>[i+1, ...cols.map(c=>String(r[c] ?? '').replace(/"/g,'""'))])]
    .map(r=>r.map(x=>`"${x}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = def.id + '-' + iso(now()) + '.csv'; a.click();
  logDownload('Report export — ' + def.name + ' (CSV)', rows.length + ' rows · ' + a.download);
  toast('Report exported');
}

/* parse "Key: value" lead e-mails / pasted blocks */
function V6_parseLeadText(txt, sourceHint){
  const out = {};
  const grab = (keys) => {
    for(const k of keys){
      const m = txt.match(new RegExp('(?:^|\\n)\\s*' + k + '\\s*[:\\-]\\s*(.+)', 'i'));
      if(m) return m[1].trim().split(/\s{2,}|\|/)[0].trim();
    }
    return '';
  };
  out.name    = grab(['name','full name','customer name','lead name','sender']);
  out.mobile  = (grab(['mobile','phone','contact','phone number','mobile no']) || (txt.match(/(?:\+?91[- ]?)?[6-9]\d{9}/) || [''])[0]).replace(/\D/g,'').slice(-10);
  out.email   = grab(['email','e-mail','mail id']) || (txt.match(/[\w.+-]+@[\w-]+\.[\w.]+/) || [''])[0];
  out.project = grab(['project','property','listing','looking for','enquired for','campaign']);
  out.city    = grab(['city','location','locality']);
  out.budget  = grab(['budget','price range']);
  out.campaign= grab(['campaign','ad name','adset']);
  out.source  = sourceHint || grab(['source','portal']) ||
                (/99acres/i.test(txt) ? '99 acres' : /housing/i.test(txt) ? 'Housing.com'
                 : /magicbricks/i.test(txt) ? 'MagicBricks' : /facebook|instagram|meta/i.test(txt) ? 'Facebook'
                 : /whatsapp/i.test(txt) ? 'WhatsApp' : 'Website');
  out.subSource = 'No-API intake';
  return out;
}

function V6_csvImport(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const lines = String(rd.result).split(/\r?\n/).filter(Boolean);
    if(lines.length < 2) return toast('That CSV looks empty','fa-triangle-exclamation');
    const head = lines[0].split(',').map(h=>h.trim().toLowerCase().replace(/^"|"$/g,''));
    const pick = (cells, names) => { for(const n of names){ const i = head.indexOf(n); if(i >= 0) return (cells[i]||'').replace(/^"|"$/g,'').trim(); } return ''; };
    let added = 0, merged = 0;
    lines.slice(1).forEach(l=>{
      const c = l.split(',');
      const mobile = pick(c, ['mobile','phone','phone_number','contact']);
      const email  = pick(c, ['email','e-mail']);
      if(!mobile && !email) return;
      const r = V6_upsertLead({
        name: pick(c, ['name','full_name','customer name']), mobile, email,
        projectMkt: pick(c, ['project','campaign_name','listing']),
        cityMkt: pick(c, ['city','location']), budgetMkt: pick(c, ['budget']),
        campaign: pick(c, ['campaign','campaign_name']), source: pick(c, ['source','platform']) || 'Website',
        subSource: 'CSV import'
      }, 'CSV import');
      r.dup ? merged++ : added++;
    });
    buildNav(); toast(added + ' new · ' + merged + ' merged','fa-file-csv'); render();
  };
  rd.readAsText(f);
}

          Primary   — developer inventory / fresh booking   (the Excel form)
          Secondary — resale only                           (the printed form)
     3. Incentive engine: accrual on every booking, payout sheet owned by Post Sales
     4. Server persistence — data lives in MongoDB via the API, not the browser
   ========================================================================== */

/* ---------------------------------------------------------------- v7 store */
const V7 = {
  /* incentive policy — editable in Bookings → Incentives → Policy */
  policy: {
    base:  { 'Sales Executive (RM)':8, 'Sales Team Leader':3, 'Branch Head':2, 'Business Associate':0 }, // % of Gross Margin
    slabs: [ { upto: 2500000, mult: 1.0,  label:'Up to ₹25 L GM in the month' },

             { upto: Infinity, mult: 1.5, label:'Above ₹50 L GM'    } ],
    payOn: 'Collected',          // incentive becomes payable only once post-sales collects

  },

};
window.V7 = V7;

/* ============================================================================
   1 · APP SIGN-IN — back to normal (no Primary/Secondary here)
   ========================================================================== */
window.V6_mountLogin = function(){
  const wrap = document.querySelector('.v6-lt'); if(wrap && wrap.parentElement) wrap.parentElement.remove();
  const lu = document.getElementById('lu'), lp = document.getElementById('lp');
  if(lu) lu.closest('.fg').style.display = '';
  if(lp) lp.closest('.fg').style.display = '';
};
/* ---- Sign-in ---------------------------------------------------------------
   The backend is the authority: POST /api/auth/login verifies a bcrypt hash and
   returns a JWT. The typed value may be either the CRM username or the user's
   e-mail — the server matches both against one field.

   The local USERS check survives only as an OFFLINE fallback. It is reached
   when the API is unreachable (Render's free tier sleeps, see API_BOOT_TIMEOUT),
   never when the API answered. A 401 is a real "no" and is shown as such —
   falling back there would let a stale plaintext password in the snapshot beat
   a rotated backend one, which is exactly what this change removes.          */
const LOGIN_TIMEOUT = 20000;

// Attach the JWT to the session token V6_signIn() just issued, so V7_headers()
// starts sending `Authorization: Bearer …` on every state save. Must run AFTER
// V6_signIn — V6_issueToken() rewrites the stored object.
function V6_attachJwt(jwt){
  try{
    const tok = V6_readToken(); if(!tok) return;
    tok.jwt = jwt;
    localStorage.setItem(V6_TOKEN_KEY, JSON.stringify(tok));
  }catch(e){}
}

/* Map the account the server authenticated onto a local USERS row, because all
   the permission helpers (prof/can/act, city filters, ownership) read ME as a
   local record. Matched on username, then e-mail; a user that exists only on
   the server is added to the roster with no local password, so the offline
   fallback can never sign them in on a stale credential. */
function V6_localUserFor(su){
  const uname = String(su.username || '').toLowerCase();
  const mail  = String(su.email || '').toLowerCase();
  let f = USERS.find(x => x.u === uname);
  if(!f && mail) f = USERS.find(x => String(x.email || '').toLowerCase() === mail);
  if(f) return f;

  const profile = PROFILES[su.profile] ? su.profile : 'Pre-Sales Executive';
  if(!PROFILES[su.profile])
    console.warn('Unknown profile from server: ' + su.profile + ' — defaulting to ' + profile);
  f = { u: uname, p: '', n: su.fullName || su.username || 'User', profile,
        role: su.role || 'sales', fid: su.id || '', manager: '',
        city: su.city || 'All', email: su.email || '' };
  USERS.push(f);
  return f;
}

window.doLogin = function(){
  const u = (el('lu').value || '').trim().toLowerCase();
  const p = (el('lp').value || '').trim();
  const err = t => { const e = el('loginErr'); e.textContent = t; e.style.display = 'block'; };
  const btn = document.querySelector('#login .btn-p');

  if(!u || !p) return err('Enter your username or e-mail, and your password.');

  el('loginErr').style.display = 'none';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing in…'; }
  const done = () => { if(btn){ btn.disabled = false; btn.innerHTML = 'Sign in'; } };

  V7_api('/api/auth/login', {
    method: 'POST',
    body: JSON.stringify({ username: u, password: p })
  }, LOGIN_TIMEOUT)
    .then(res => {
      done();
      const f = V6_localUserFor(res.user || {});
      if(f.active === false) return err('This login is deactivated. Ask an administrator.');
      // No local expiry check here: the server verified the live password, and
      // V6's lifecycle dates describe the snapshot's copy, not the server's.
      V6_signIn(f);
      V6_attachJwt(res.token);
    })
    .catch(e => {
      done();
      if(e.status === 401) return err('That username and password don’t match.');
      if(e.status)         return err('Sign-in failed: ' + e.message);
      // No status => the request never got an answer. Fall back to offline mode.
      V6_offlineLogin(u, p, err);
    });
};

/* Offline fallback: match the local snapshot on username OR e-mail. The V6
   password lifecycle still applies here, since this path IS the local copy. */
function V6_offlineLogin(u, p, err){
  const f = USERS.find(x => (x.u === u || String(x.email || '').toLowerCase() === u) && x.p && x.p === p);
  if(!f) return err('Can’t reach the server, and that username and password don’t match the offline copy.');
  if(f.active === false) return err('This login is deactivated. Ask an administrator.');
  const left = V6_pwdDaysLeft(f);
  if(f.mustChange || left <= 0){ V6_forceChange(f); return; }   // expiry policy stays
  V6_signIn(f);
  setTimeout(()=>toast('Signed in offline — changes sync when the server is back','fa-cloud-arrow-up'), 900);
  if(left <= V6.sec.warnDays)
    setTimeout(()=>toast('Your password expires in ' + left + ' day' + (left === 1 ? '' : 's') + ' — change it in Settings','fa-key'), 1800);
}

const NV = id => { const e = el(id); return e ? (+e.value || 0) : 0; };
const SV = id => { const e = el(id); return e ? e.value : ''; };
const CK = id => { const e = el(id); return !!(e && e.checked); };
const money = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');

/* ---------- PRIMARY (developer inventory) — the Excel sheet, live ---------- */
function V7_calcPrimary(){
  const area   = NV('lf_sa');
  const basic  = NV('lf_basic');                 // ₹ / sq.ft.
  const tpr    = NV('lf_tpr'), plc = NV('lf_plc'), other = NV('lf_other');
  const disc   = NV('lf_disc');                  // on-form discount ₹ / sq.ft.
  const slab   = NV('lf_slab');                  // brokerage %
  const cnPct  = NV('lf_cn');                    // credit note %
  const pbPct  = NV('lf_pb');                    // BA passback %

  const grossBSP   = basic + tpr + plc + other;          // per sq.ft.
  const totalCost  = grossBSP * area;
  const soldBSP    = basic - disc;                       // per sq.ft.
  const netBasic   = soldBSP * area;

  const grPct      = slab;
  const grAmt      = netBasic * grPct / 100;
  const onFormPct  = basic ? (disc / basic) * 100 : 0;
  const onFormAmt  = disc * area;
  const finalGRPct = Math.max(0, grPct - onFormPct);
  const finalGRAmt = netBasic * finalGRPct / 100;
  const cnAmt      = netBasic * cnPct / 100;
  const pbAmt      = netBasic * pbPct / 100;
  const gmAmt      = finalGRAmt - cnAmt - pbAmt;
  const gmPct      = netBasic ? (gmAmt / netBasic) * 100 : 0;

  const set = (id, v) => { const e = el(id); if(e) e.textContent = v; };
  set('o_grossbsp', money(grossBSP) + ' /sq.ft.');
  set('o_total',    money(totalCost));
  set('o_soldbsp',  money(soldBSP) + ' /sq.ft.');
  set('o_netbasic', money(netBasic));
  set('o_gr',       grPct.toFixed(2) + '%  ·  ' + money(grAmt));
  set('o_onform',   onFormPct.toFixed(2) + '%  ·  ' + money(onFormAmt));
  set('o_fgr',      finalGRPct.toFixed(2) + '%  ·  ' + money(finalGRAmt));
  set('o_cn',       money(cnAmt));
  set('o_pb',       money(pbAmt));
  set('o_gm',       gmPct.toFixed(2) + '%  ·  ' + money(gmAmt));

  const inc = V7_previewIncentive(gmAmt, 'Primary');
  set('o_inc', money(inc.total) + '  (RM ' + money(inc.rm) + ' · TL ' + money(inc.tl) + ')');
  return { area, basic, tpr, plc, other, disc, slab, grossBSP, totalCost, soldBSP, netBasic,
           grPct, grAmt, onFormPct, onFormAmt, finalGRPct, finalGRAmt, cnPct, cnAmt, pbPct, pbAmt, gmPct, gmAmt };
}

/* ---------- SECONDARY (resale) — the printed form, live -------------------- */
function V7_calcSecondary(){
  const area  = NV('lf_sa');
  const bsp   = NV('lf_bsp');           // ₹ / sq.ft.
  const adj   = NV('lf_adj'), plc = NV('lf_plc'), ifms = NV('lf_ifms'),
        park  = NV('lf_park'), club = NV('lf_club');
  const slab  = NV('lf_slab');          // total slab %
  const cn    = NV('lf_cn');            // credit note ₹
  const pb    = NV('lf_pb');            // BA passback ₹
  const si    = NV('lf_si');            // special incentive ₹

  const basicAmt = bsp * area;
  const tsv      = basicAmt + adj + (plc * area) + ifms + park + club;   // total sale value
  const grAmt    = basicAmt * slab / 100;
  const gmAmt    = grAmt - cn - pb + si;
  const gmPct    = basicAmt ? (gmAmt / basicAmt) * 100 : 0;

  const set = (id, v) => { const e = el(id); if(e) e.textContent = v; };
  set('o_basic', money(basicAmt));
  set('o_tsv',   money(tsv));
  set('o_gr',    slab.toFixed(2) + '%  ·  ' + money(grAmt));
  set('o_gm',    gmPct.toFixed(2) + '%  ·  ' + money(gmAmt));
  const inc = V7_previewIncentive(gmAmt, 'Secondary');
  set('o_inc', money(inc.total) + '  (RM ' + money(inc.rm) + ' · TL ' + money(inc.tl) + ')');
  return { area, bsp, adj, plc, ifms, park, club, basicAmt, tsv, slab, grAmt, cn, pb, si, gmAmt, gmPct };
}

function V7_calc(type){ return type === 'Primary' ? V7_calcPrimary() : V7_calcSecondary(); }

function V7_submitLoginForm(d, type){
  const aps = V7_readAps();
  if(!aps.length || !aps[0].name || !aps[0].mobile || !aps[0].email)
    return toast('The main applicant needs a name, mobile and e-mail','fa-triangle-exclamation');
  if(!SV('lf_prj') || !SV('lf_ut') || !NV('lf_sa'))
    return toast('Project, unit type and super area are required','fa-triangle-exclamation');
  if(!SV('lf_rm') || !SV('lf_tl')) return toast('RM and Team Leader are required','fa-triangle-exclamation');
  if(!NV('lf_slab')) return toast('The brokerage slab % is required','fa-triangle-exclamation');
  if(type === 'Primary' && !NV('lf_basic')) return toast('Basic cost / sq.ft. is required','fa-triangle-exclamation');
  if(type === 'Secondary' && !NV('lf_bsp')) return toast('BSP / sq.ft. is required','fa-triangle-exclamation');

  const calc = V7_calc(type);
  const baOn = CK('lf_baon');
  const at = now().toISOString();

  const b = {
    id: uid('b'), dealId: d.id, custId: d.custId, formType: type,
    header: { submissionDate:SV('lf_sub'), month:SV('lf_mon'), leadSource:SV('lf_src'), inventoryType:SV('lf_inv'),
              closureDate:SV('lf_cl'), homeLoan:SV('lf_hl'), selfFunding:SV('lf_sf') },
    seller: type === 'Secondary' ? { a1:SV('lf_s1'), a1c:SV('lf_s1c'), a2:SV('lf_s2'), a2c:SV('lf_s2c') } : null,
    applicants: aps,
    property: { project:SV('lf_prj'), developer:SV('lf_dev'), unit:SV('lf_un'), floor:SV('lf_fl'),
                config:SV('lf_ut'), propType:d.propTypeSales || '', super:NV('lf_sa'), carpet:'',
                bsp: type === 'Primary' ? calc.basic : calc.bsp,
                plc: NV('lf_plc'), edc:0, ifms: type === 'Secondary' ? NV('lf_ifms') : 0, gst:0,
                devRM: SV('lf_drm'), devRMPhone: SV('lf_drp'), devRMEmail: SV('lf_dre'),
                paymentPlanType: SV('lf_pp') || '', paymentTimeline: SV('lf_pt') || '', atsTimeline: SV('lf_ats') || '' },
    sales: { rm:SV('lf_rm'), tl:SV('lf_tl'), slab:SV('lf_slab') + '%',
             discount: type === 'Primary' ? Math.round(calc.onFormAmt) : 0,
             passback: type === 'Primary' ? Math.round(calc.pbAmt) : NV('lf_pb'),
             bookingType: SV('lf_bt') },
    ba: baOn ? { name:SV('lf_bnm'), spoc:SV('lf_bsp'), mobile:SV('lf_bph'), email:SV('lf_bem'),
                 company:SV('lf_bnm'), designation:'', code:V6_baCode(SV('lf_bnm')),
                 passback: type === 'Primary' ? Math.round(calc.pbAmt) : NV('lf_pb') } : null,
    rev: calc,
    gm: Math.round(calc.gmAmt || 0),
    grossRevenue: Math.round((calc.finalGRAmt != null ? calc.finalGRAmt : calc.grAmt) || 0),
    bookingAmount: { amount:NV('lf_bkamt'), date:SV('lf_bkdt'), mode:SV('lf_bkmd'), bank:SV('lf_bkbn'), ref:SV('lf_bkrf') },
    docs: [...document.querySelectorAll('.colpick input:checked')].map(i=>({ key:i.id, name:i.parentElement.textContent.trim() })),
    remarks: SV('lf_rem'),
    submittedBy: ME.n, submittedAt: at, approved: false, postStage: null, chatter: [],
    costSheet:'', paymentPlan:'', bbaDate:'', invoiceNo:'', collectedAmt:0, cancelReason:'',
    audit: [{ field:'Login form submitted (' + type + ')', old:'—', new:'Sent for approval', by:ME.n, at }]
  };
  b.total = Math.round(type === 'Primary' ? calc.totalCost : calc.tsv);

  /* approval route — unchanged rules, plus a resale sign-off */
  b.route = [{ k:'approveBranch', label:'Branch Head', status:'Pending', reason:'Every booking' }];
  if(b.sales.discount || b.sales.passback)
    b.route.push({ k:'approveSalesHead', label:'Sales Head', status:'Pending', reason: b.sales.discount ? 'On-form discount' : 'Pass back' });
  if(b.ba || b.total >= 30000000)
    b.route.push({ k:'approveCFO', label:'CFO', status:'Pending', reason: b.ba ? 'Business Associate payout' : 'Value ≥ ₹3 Cr' });
  if(b.total >= 50000000)
    b.route.push({ k:'approveCEO', label:'CEO', status:'Pending', reason:'Value ≥ ₹5 Cr' });

  DB.bookings.push(b); idxAdd(DB.bookings, b); d.bookingId = b.id;
  audit(d, 'Login form', '—', type + ' · ' + b.id);
  V7_accrue(b);                                     // incentive accrues the moment the file is raised

  const first = USERS.find(u=>PROFILES[u.profile] && PROFILES[u.profile].act[b.route[0].k]);
  notify(first ? first.n : 'Saurabh Singh Kushwah',
    `Login form ${b.id} (${type}, ${inr(b.total)}) awaits your approval as ${b.route[0].label}`,
    { type:'booking', id:b.id }, 'fa-file-signature');
  closeModal(); buildNav(); V7_save();
  toast(type + ' login form ' + b.id + ' sent to ' + b.route[0].label);
  openRec('booking', b.id);
}

/* ============================================================================
   3 · INCENTIVE ENGINE
       Accrues on the booking's GROSS MARGIN, multiplied by the RM's monthly
       achievement slab. Becomes payable only when Post Sales marks it Collected.
   ========================================================================== */
function V7_monthKey(d){ const x = new Date(d); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2,'0'); }
function V7_monthGM(rm, when){
  const mk = V7_monthKey(when);
  return DB.bookings.filter(b=>b.sales && b.sales.rm === rm && V7_monthKey(b.submittedAt) === mk)
                    .reduce((s,b)=>s + (b.gm || 0), 0);
}
function V7_slabFor(gmMonth){
  return V7.policy.slabs.find(s=>gmMonth <= s.upto) || V7.policy.slabs[V7.policy.slabs.length - 1];
}
function V7_pctFor(name){
  const u = USERS.find(x=>x.n === name);
  return (u && V7.policy.base[u.profile]) || 0;
}
/* live preview while the form is being typed */
function V7_previewIncentive(gm, type){
  const mult = V7_slabFor(V7_monthGM(ME ? ME.n : '', now())).mult;
  const bonus = type === 'Secondary' ? V7.policy.resaleBonusPct : 0;
  const rmPct = (V7.policy.base['Sales Executive (RM)'] || 0) + bonus;
  const tlPct = V7.policy.base['Sales Team Leader'] || 0;
  const rm = gm * rmPct / 100 * mult, tl = gm * tlPct / 100 * mult;
  return { rm, tl, total: rm + tl, mult };
}
/* the real accrual, written on the booking */
function V7_accrue(b){
  const gm = b.gm || 0;
  const when = b.submittedAt;
  const mult = V7_slabFor(V7_monthGM(b.sales.rm, when)).mult;
  const bonus = b.formType === 'Secondary' ? V7.policy.resaleBonusPct : 0;
  const people = [
    { name: b.sales.rm, role:'Sales Executive (RM)', pct: (V7.policy.base['Sales Executive (RM)'] || 0) + bonus },
    { name: b.sales.tl, role:'Sales Team Leader',    pct: V7.policy.base['Sales Team Leader'] || 0 }
  ];
  const bh = (USERS.find(u=>u.n === b.sales.tl) || {}).manager;
  if(bh) people.push({ name: bh, role:'Branch Head', pct: V7.policy.base['Branch Head'] || 0 });

  const lines = people.filter(p=>p.name && p.pct).map(p=>({
    to: p.name, role: p.role, pct: p.pct, mult,
    amount: Math.round(gm * p.pct / 100 * mult)
  }));
  V7.payouts[b.id] = { bookingId:b.id, gm, mult, status:'Accrued', lines,
    total: lines.reduce((s,l)=>s + l.amount, 0), at: V6_now(), by:'System', paidAt:'', approvedBy:'' };
  return V7.payouts[b.id];
}
function V7_recalcAll(){ DB.bookings.forEach(b=>{ if(b.gm != null && b.sales) V7_accrue(b); }); toast('Incentives recalculated on the new policy'); V7_save(); render(); }

/* payout state: Accrued → (post-sales collects) Payable → Approved → Paid */
function V7_payState(b){
  const p = V7.payouts[b.id]; if(!p) return null;
  if(p.status === 'Paid' || p.status === 'Approved') return p.status;
  if(b.postStage === 'Cancelled') return 'Cancelled';
  if(b.postStage === V7.policy.payOn) return 'Payable';
  return b.approved ? 'Accrued' : 'Pending approval';
}
function V7_setPay(id, status){
  if(!act('postStage') && !act('approveFinance') && !act('manageUsers'))
    return toast('Only Post Sales / Finance can move an incentive payout','fa-lock');
  const p = V7.payouts[id]; if(!p) return;
  p.status = status; p.by = ME.n; p.at = V6_now();
  if(status === 'Paid') p.paidAt = V6_now();
  if(status === 'Approved') p.approvedBy = ME.n;
  const b = byId(DB.bookings, id);
  if(b) b.audit.unshift({ field:'Incentive payout', old:'—', new:status + ' (' + inr(p.total) + ')', by:ME.n, at:V6_now() });
  p.lines.forEach(l=>notify(l.to, 'Incentive ' + status.toLowerCase() + ' — ' + inr(l.amount) + ' on booking ' + id, { type:'booking', id }, 'fa-award'));
  toast('Incentive marked ' + status); V7_save(); render();
}
