/* ============================================================================
   4 · SERVER PERSISTENCE — the whole CRM lives on the API, not in this browser
   ========================================================================== */
/* ---- Backend configuration -------------------------------------------------
   Persistence now lives on the API, not in the browser. Override any of these
   before this script runs (e.g. from a build step or an injected <script>):
     window.CRM_API_BASE, window.CRM_WORKSPACE_KEY, window.CRM_WORKSPACE
   ...or via <meta name="crm-api-base" content="..."> in the page head.       */
const _meta = n => (document.querySelector('meta[name="' + n + '"]') || {}).content || '';
const API_BASE      = String(window.CRM_API_BASE      || _meta('crm-api-base')      || 'https://infra-crm.onrender.com').replace(/\/+$/, '');
const API_KEY       = String(window.CRM_WORKSPACE_KEY || _meta('crm-workspace-key') || '');
const API_WORKSPACE = String(window.CRM_WORKSPACE     || _meta('crm-workspace')     || 'default');

/* Render's free tier sleeps; a cold start can take the better part of a minute. */
const API_BOOT_TIMEOUT = 70000, API_SAVE_TIMEOUT = 25000;
const OUTBOX_KEY = 'im_crm_outbox';

let _saveT = null, V7_lastSave = null, V7_lastHash = null, V7_online = true, V7_saving = false;

function V7_headers(){
  const h = { 'Content-Type': 'application/json', 'x-workspace': API_WORKSPACE };
  if(API_KEY) h['x-workspace-key'] = API_KEY;
  const tok = (function(){ try{ return JSON.parse(localStorage.getItem(V6_TOKEN_KEY) || 'null'); }catch(e){ return null; } })();
  if(tok && tok.jwt) h['Authorization'] = 'Bearer ' + tok.jwt;
  return h;
}

function V7_api(path, opts, timeout){
  const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(), timeout || API_SAVE_TIMEOUT) : null;
  return fetch(API_BASE + path, Object.assign({ headers: V7_headers(), signal: ctl && ctl.signal }, opts || {}))
    .then(async r=>{
      if(timer) clearTimeout(timer);
      const body = await r.json().catch(()=>({}));
      if(!r.ok){
        const err = new Error(body.error || ('HTTP ' + r.status));
        err.status = r.status; err.body = body; throw err;
      }
      V7_online = true;
      return body;
    })
    .catch(e=>{ if(timer) clearTimeout(timer); if(e.name === 'AbortError') e.message = 'Request timed out'; V7_online = false; throw e; });
}

/* ---- Same contract the IndexedDB helpers had: put(key,val) / get(key). -----
   Only the transport changed, so every caller below is untouched.            */
/* Optimistic-concurrency cursor: the `rev` this tab last read or wrote. Sent as
   baseRev on every save, so the server can reject a write built on stale data
   instead of letting one tab silently flatten another's work. */
let V7_rev = null;

function V7_idbPut(key, val, opts){
  const force = !!(opts && opts.force);
  const body = { data: val, by: (ME && ME.n) || '' };
  // Omit baseRev on a forced save — that is the deliberate "mine wins" path.
  if(!force && V7_rev !== null) body.baseRev = V7_rev;

  return V7_api('/api/state/' + encodeURIComponent(key), {
    method: 'PUT',
    body: JSON.stringify(body),
    keepalive: !!(opts && opts.keepalive)
  }).then(res=>{
      if(typeof res.rev === 'number') V7_rev = res.rev;
      V7_outboxClear();
      return res;
    })
    .catch(e=>{
      // Always park the payload: a conflict must not throw the edit away either.
      V7_outboxSet(key, val);
      if(e.status === 409) V7_onConflict(key, val, e.body || {});
      throw e;
    });
}

function V7_idbGet(key){
  return V7_api('/api/state/' + encodeURIComponent(key), { method: 'GET' }, API_BOOT_TIMEOUT)
    .then(res=>{ V7_rev = typeof res.rev === 'number' ? res.rev : null; return res.data; });
}

/* ---- Save conflict ---------------------------------------------------------
   Someone else saved while this tab was editing. Because the whole CRM travels
   as ONE snapshot there is no field-level merge to do — the two versions are
   whole-database alternatives, so the choice has to go to the person. Silently
   picking either side is what caused the overwrites in the first place.      */
let V7_conflictOpen = false;

function V7_onConflict(key, mine, info){
  if(V7_conflictOpen) return;              // one prompt, not one per retry
  V7_conflictOpen = true;
  clearTimeout(_saveT);                     // stop the debounce re-firing behind the modal

  const who  = info.updatedByName ? esc(info.updatedByName) : 'Someone else';
  const when = info.updatedAt ? new Date(info.updatedAt).toLocaleString() : 'just now';

  modal('Someone else saved first', `
    <p class="hint" style="margin:0 0 10px"><i class="fa-solid fa-triangle-exclamation"></i>
      <b>${who}</b> saved changes at ${esc(when)}, after this tab loaded its copy.</p>
    <p style="margin:0 0 12px;font-size:12.5px">The CRM saves as one document, so these
      can't be merged automatically. Your unsaved changes are kept locally either way.</p>
    <div class="grid" style="gap:8px">
      <button class="btn btn-o" style="justify-content:flex-start" onclick="V7_conflictTakeTheirs()">
        <i class="fa-solid fa-cloud-arrow-down"></i>
        <span><b>Load their version</b><br><span class="mini">Discards what you changed in this tab.</span></span>
      </button>
      <button class="btn btn-o" style="justify-content:flex-start" onclick="V7_conflictKeepMine()">
        <i class="fa-solid fa-cloud-arrow-up"></i>
        <span><b>Keep mine</b><br><span class="mini">Overwrites ${who}'s changes.</span></span>
      </button>
    </div>`, null, 'Decide later');
}

window.V7_conflictTakeTheirs = function(){
  closeModal(); V7_conflictOpen = false;
  V7_idbGet('db')
    .then(s=>{
      if(V7_restore(s)){
        V7_outboxClear();
        V7_lastHash = null;                 // force the next real edit to save
        buildNav(); render();
        toast('Loaded the newer version from the server','fa-cloud-arrow-down');
      } else {
        toast('The server copy could not be read — your changes are still queued','fa-triangle-exclamation');
      }
    })
    .catch(()=>toast('Could not reach the server — your changes are still queued','fa-plug-circle-xmark'));
};

/* Dismissing the prompt ("Decide later", Esc, the ✕) must re-arm it, or the
   conflict would never be raised again and the edit would sit queued in silence. */
const V7_closeModalBase = closeModal;
window.closeModal = function(){ V7_conflictOpen = false; V7_closeModalBase(); };

window.V7_conflictKeepMine = function(){
  closeModal(); V7_conflictOpen = false;
  const pending = V7_outboxRead();
  const payload = pending ? pending.val : JSON.parse(JSON.stringify(V7_snapshot()));
  V7_idbPut('db', payload, { force: true })
    .then(()=>toast('Saved — your version is now the current one','fa-cloud-arrow-up'))
    .catch(e=>toast('Save failed: ' + e.message,'fa-triangle-exclamation'));
};

function V7_idbDelete(key){
  return V7_api('/api/state/' + encodeURIComponent(key), { method: 'DELETE' });
}

/* ============================================================================
   4b · CUSTOMERS — DUAL-WRITE (migration stage 1 of 2)
   ----------------------------------------------------------------------------
   Customers now also live in a real Mongo collection behind /api/customers.
   During this stage the SNAPSHOT REMAINS AUTHORITATIVE: every read still comes
   from DB.customers, and nothing below can change what the user sees. We only
   mirror writes outward, so the collection can be compared against the blob
   before reads are flipped over (stage 2).

   Why diff at save time instead of calling the API from newCustomer(),
   setField(), editField(), commitCustStage(), markLeadComplete(), abortModal(),
   addNote() and the rest: there are dozens of mutation sites, and any one
   missed would silently drift. The save path is the single choke point every
   mutation already funnels through, so diffing here cannot miss an edit.

   Failures are deliberately non-fatal — a mirror that breaks the CRM would be
   worse than no mirror. Anything that fails is simply retried on the next save,
   because the baseline is only advanced for records that actually synced.   */

const CUST_TRAILS = ['notes', 'activities', 'comms', 'chatter'];
// Never PATCH these: `id` is immutable, the trails have their own endpoint, and
// audit is written server-side from the diff.
const CUST_SKIP = new Set(['id', 'audit', ...CUST_TRAILS]);
// Cap per cycle so a bulk import can't blow the API's 240/min budget. The
// remainder goes out on the next save rather than being dropped.
const CUST_SYNC_MAX = 25;

let V7_custBase = new Map();      // id -> { fields:{...}, lens:{notes:n,...} }
let V7_custDrift = 0;             // records that failed to mirror, for the UI

const V7_custFields = (c) => {
  const out = {};
  for(const k of Object.keys(c)) if(!CUST_SKIP.has(k) && typeof c[k] !== 'function') out[k] = c[k];
  return out;
};
const V7_custLens = (c) => {
  const l = {};
  for(const t of CUST_TRAILS) l[t] = (c[t] || []).length;
  return l;
};
function V7_custSnapshotOne(c){ return { fields: V7_custFields(c), lens: V7_custLens(c) }; }

/* Seed the baseline from whatever we just loaded, so a page load does not
   re-POST every existing customer. Initial population is the backfill script's
   job (npm run backfill:customers:write) — this only carries changes made from
   here on. */
function V7_custBaseline(){
  V7_custBase = new Map();
  (DB.customers || []).forEach(c => V7_custBase.set(c.id, V7_custSnapshotOne(c)));
}

function V7_custHasJwt(){
  try{ const t = JSON.parse(localStorage.getItem(V6_TOKEN_KEY) || 'null'); return !!(t && t.jwt); }
  catch(e){ return false; }
}

/* Mirror everything that changed since the last successful sync. */
function V7_custSync(){
  // The customer routes are JWT-only. An offline sign-in has no JWT, so there
  // is nothing to mirror with — the snapshot still holds the edit either way.
  if(!V7_custHasJwt() || !V7_online) return Promise.resolve();

  const jobs = [];
  for(const c of DB.customers || []){
    if(jobs.length >= CUST_SYNC_MAX) break;
    const prev = V7_custBase.get(c.id);

    if(!prev){ jobs.push(V7_custCreate(c)); continue; }

    const fields = V7_custFields(c), patch = {};
    for(const k of Object.keys(fields))
      if(JSON.stringify(fields[k]) !== JSON.stringify(prev.fields[k])) patch[k] = fields[k];

    const lens = V7_custLens(c);
    const grew = CUST_TRAILS.filter(t => lens[t] > (prev.lens[t] || 0));

    if(Object.keys(patch).length || grew.length) jobs.push(V7_custUpdate(c, patch, grew, prev));
  }

  if(!jobs.length) return Promise.resolve();
  return Promise.all(jobs).then(rs=>{
    const failed = rs.filter(r => r === false).length;
    V7_custDrift = failed;
    if(failed) console.warn(`Customer mirror: ${failed} record(s) did not sync; retrying on next save.`);
  });
}

function V7_custCreate(c){
  return V7_api('/api/customers', { method: 'POST', body: JSON.stringify(c) })
    .then(()=>{ V7_custBase.set(c.id, V7_custSnapshotOne(c)); return true; })
    .catch(e=>{
      // 400 means this record can never be accepted as-is (no name, say).
      // Baseline it anyway or every future save retries it forever.
      if(e.status === 400){ V7_custBase.set(c.id, V7_custSnapshotOne(c)); console.warn('Customer ' + c.id + ' rejected by the API: ' + e.message); return true; }
      return false;
    });
}

function V7_custUpdate(c, patch, grew, prev){
  const calls = [];
  if(Object.keys(patch).length)
    calls.push(V7_api('/api/customers/' + encodeURIComponent(c.id), { method: 'PATCH', body: JSON.stringify(patch) }));

  // Trails are unshifted at the front locally, so the new entries are the head
  // of the array. Send them oldest-first: the server also inserts at position 0,
  // so reversing here preserves the original order on the other side.
  for(const t of grew){
    const added = (c[t] || []).slice(0, (c[t] || []).length - (prev.lens[t] || 0)).reverse();
    for(const entry of added)
      calls.push(V7_api('/api/customers/' + encodeURIComponent(c.id) + '/' + t, { method: 'POST', body: JSON.stringify(entry) }));
  }

  return Promise.all(calls)
    .then(()=>{ V7_custBase.set(c.id, V7_custSnapshotOne(c)); return true; })
    .catch(e=>{
      // A 404 here means the row was never created (backfill not run yet, or the
      // caller can't see it). Try creating it, so a fresh deploy self-heals.
      if(e.status === 404) return V7_custCreate(c);
      return false;
    });
}

/* Manual full push, for the first cutover if you would rather not run the
   backfill script — resets the baseline so every customer is re-sent. Creates
   are idempotent server-side, so this is safe to run more than once.
   Call from the console: V7_custSyncAll()                                    */
window.V7_custSyncAll = function(){
  V7_custBase = new Map();
  const step = () => V7_custSync().then(()=>{
    const done = V7_custBase.size, total = (DB.customers || []).length;
    console.info(`Customer mirror: ${done}/${total}`);
    if(done < total) return step();
    toast('All customers mirrored to the database','fa-database');
  });
  return step();
};

/* ---- Offline outbox --------------------------------------------------------
   A failed save is parked in localStorage so a dropped connection or a sleeping
   dyno can never lose the last edit. It is replayed as soon as a save works.  */
function V7_outboxSet(key, val){
  try{ localStorage.setItem(OUTBOX_KEY, JSON.stringify({ key, val, at: Date.now() })); }catch(e){}
}
function V7_outboxClear(){ try{ localStorage.removeItem(OUTBOX_KEY); }catch(e){} }
function V7_outboxRead(){
  try{ const raw = localStorage.getItem(OUTBOX_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function V7_flushOutbox(){
  // Deliberately NOT gated on V7_online: that flag only flips back to true when a
  // request succeeds, so gating here would deadlock the retry loop forever.
  const pending = V7_outboxRead(); if(!pending) return Promise.resolve(false);
  return V7_idbPut(pending.key, pending.val).then(()=>true).catch(()=>false);
}
window.addEventListener('online', ()=>{ V7_online = true; V7_flushOutbox(); });
setInterval(()=>{ if(ME && V7_outboxRead()) V7_flushOutbox(); }, 30000);

function V7_snapshot(){
  return {
    v: 7, at: V6_now(),
    seq: DB.seq,
    customers: DB.customers, deals: DB.deals, bookings: DB.bookings,
    projects: DB.projects, tasks: DB.tasks, reports: DB.reports, views: DB.views,
    users: USERS.map(u=>({ u:u.u, p:u.p, n:u.n, profile:u.profile, role:u.role, fid:u.fid, manager:u.manager,
                           city:u.city, baCode:u.baCode, pwdChangedAt:u.pwdChangedAt, mustChange:u.mustChange, active:u.active })),
    v6: { views:V6.views, shares:V6.shares, rules:V6.rules, rr:V6.rr, reports:V6.reports,
          folders:V6.folders, subs:V6.subs, intake:V6.intake, sec:V6.sec, ownerLog:V6.ownerLog },
    v7: { policy: { ...V7.policy, slabs: V7.policy.slabs.map(s=>({ ...s, upto: s.upto === Infinity ? null : s.upto })) },
          payouts: V7.payouts }
  };
}
function V7_save(){
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    if(V7_saving) return V7_save();               // a write is in flight; coalesce
    let payload;
    try{ payload = JSON.parse(JSON.stringify(V7_snapshot())); }
    catch(e){ return console.warn('snapshot failed', e); }

    // Skip the round-trip when nothing actually changed since the last save.
    const body = JSON.stringify(payload);
    if(V7_lastHash === body) return;

    V7_saving = true;
    V7_idbPut('db', payload)
      .then(()=>{ V7_lastSave = new Date(); V7_lastHash = body; })
      .catch(e=>console.warn('Backend save failed (queued for retry):', e.message))
      // Mirror customer changes into their own collection. Runs whether or not
      // the snapshot write succeeded, and can never reject — the snapshot is
      // still the system of record during this migration stage.
      .then(()=>V7_custSync().catch(e=>console.warn('Customer mirror failed:', e.message)))
      .finally(()=>{ V7_saving = false; });
  }, 1200);
}
function V7_restore(s){
  if(!s || !s.customers) return false;
  DB.seq = s.seq || DB.seq;
  ['customers','deals','bookings','projects','tasks','reports'].forEach(k=>{
    DB[k].length = 0; (s[k] || []).forEach(r=>DB[k].push(r));
  });
  if(s.views) DB.views = s.views;
  (s.users || []).forEach(su=>{
    const u = USERS.find(x=>x.u === su.u);
    if(u) Object.assign(u, su); else USERS.push(su);
  });
  if(s.v6) Object.keys(s.v6).forEach(k=>{ if(s.v6[k] != null) V6[k] = s.v6[k]; });
  if(s.v7){
    if(s.v7.policy){
      V7.policy = s.v7.policy;
      V7.policy.slabs = (V7.policy.slabs || []).map(x=>({ ...x, upto: x.upto == null ? Infinity : x.upto }));
    }
    V7.payouts = s.v7.payouts || {};
  }
  reindex();
  // Everything just loaded is assumed to be already in the customers collection
  // (put there by npm run backfill:customers:write), so only edits made from
  // here on are mirrored. V7_custSyncAll() forces a full push if it isn't.
  V7_custBaseline();
  return true;
}
/* boot: load from the backend BEFORE anything seeds, then restore the session */
window.V6_boot = function(){
  V6_mountLogin();
  V7_bootBanner('Connecting to the CRM server…');

  const finish = () => {
    V7_bootBanner(null);
    const tok = V6_readToken();
    if(tok && (Date.now() - tok.last) < V6.sec.idleMins * 60000){
      const u = USERS.find(x => x.u === tok.u);
      if(u){ V6_signIn(u); return; }
    }
    V6_clearToken();
  };

  V7_idbGet('db')
    .then(s=>{
      if(V7_restore(s)){
        console.info('CRM loaded from backend —', DB.customers.length, 'customers,', DB.deals.length, 'deals');
        V7_lastSave = new Date();
      }else{
        // Nothing stored yet: this is a first run. The local seed() (invoked on
        // sign-in) becomes the initial dataset and is pushed up by V7_save().
        console.info('Backend has no snapshot yet — it will be seeded on first sign-in.');
      }
      finish();
    })
    .catch(e=>{
      console.warn('Could not reach the backend:', e.message);
      V7_bootBanner(null);
      // Replay anything stranded in the outbox so an offline session still shows
      // the newest data rather than silently reverting to the demo seed.
      const pending = V7_outboxRead();
      if(pending && V7_restore(pending.val)) console.info('Restored unsaved changes from the local outbox.');
      finish();
      setTimeout(()=>toast('Working offline — the server is unreachable. Changes are queued.','fa-triangle-exclamation'), 800);
    });
};

/* small non-blocking banner while the API wakes up (Render free tier sleeps) */
function V7_bootBanner(msg){
  let b = document.getElementById('v7_boot');
  if(!msg){ if(b) b.remove(); return; }
  if(!b){
    b = document.createElement('div');
    b.id = 'v7_boot';
    b.style.cssText = 'position:fixed;z-index:9999;left:50%;top:14px;transform:translateX(-50%);' +
      'background:#111;color:#fff;padding:8px 16px;border-radius:999px;font:500 13px system-ui,sans-serif;' +
      'box-shadow:0 4px 16px rgba(0,0,0,.25)';
    document.body.appendChild(b);
  }
  b.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> ' + msg;
}

/* persist after every paint (debounced) and on the way out */
const V7_renderBase = render;
window.render = function(){ V7_renderBase(); if(ME) V7_save(); };
function V7_flushNow(){
  try{
    const payload = JSON.parse(JSON.stringify(V7_snapshot()));
    V7_outboxSet('db', payload);                       // safety net if the flush dies with the page
    V7_idbPut('db', payload, { keepalive: true }).catch(()=>{});
  }catch(e){}
}
// pagehide fires reliably on mobile Safari where beforeunload does not.
window.addEventListener('pagehide', V7_flushNow);
window.addEventListener('beforeunload', V7_flushNow);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden' && ME) V7_flushNow(); });

/* Setup → Data & storage */
function vStorage(){
  const bytes = (()=>{ try{ return new Blob([JSON.stringify(V7_snapshot())]).size; }catch(e){ return 0; } })();
  const kb = (bytes/1024).toFixed(0);
  return `<div class="card"><div class="card-h"><h3><i class="fa-solid fa-database"></i>Data &amp; storage (server)</h3>
      <div class="pill-h">
        <button class="btn btn-o btn-s" onclick="V7_saveNow()"><i class="fa-solid fa-floppy-disk"></i> Save now</button>
        <button class="btn btn-o btn-s" onclick="V7_exportBackup()"><i class="fa-solid fa-download"></i> Backup (JSON)</button>
        <label class="btn btn-o btn-s" style="cursor:pointer"><i class="fa-solid fa-upload"></i> Restore
          <input type="file" accept=".json" style="display:none" onchange="V7_importBackup(this)"></label>
        <button class="btn btn-d btn-s" onclick="V7_wipe()"><i class="fa-solid fa-trash"></i> Clear stored data</button>
      </div></div>
    <div class="card-b">
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(190px,1fr))">
        <div class="kpi"><div class="l">Customers</div><div class="n">${DB.customers.length.toLocaleString('en-IN')}</div><div class="s">stored</div></div>
        <div class="kpi"><div class="l">Deals</div><div class="n">${DB.deals.length.toLocaleString('en-IN')}</div><div class="s">stored</div></div>
        <div class="kpi"><div class="l">Bookings</div><div class="n">${DB.bookings.length}</div><div class="s">with incentives</div></div>
        <div class="kpi"><div class="l">Activities</div><div class="n">${DB.tasks.length}</div><div class="s">photos &amp; GPS included</div></div>
        <div class="kpi"><div class="l">Snapshot size</div><div class="n">${kb} KB</div><div class="s">server · key "db"</div></div>
        <div class="kpi"><div class="l">Connection</div><div class="n" style="font-size:15px">${V7_online ? 'Online' : 'Offline'}</div><div class="s">${esc(API_BASE.replace(/^https?:\/\//,''))}</div></div>
        <div class="kpi"><div class="l">Queued changes</div><div class="n">${V7_outboxRead() ? 1 : 0}</div><div class="s">${V7_outboxRead() ? 'waiting to sync' : 'all synced'}</div></div>
        <div class="kpi"><div class="l">Last saved</div><div class="n" style="font-size:15px">${V7_lastSave ? ftime(V7_lastSave) : '—'}</div><div class="s">auto-saves after every change</div></div>
        <div class="kpi"><div class="l">Customer mirror</div><div class="n" style="font-size:15px">${V7_custDrift ? V7_custDrift + ' pending' : 'In sync'}</div><div class="s">${V7_custBase.size} of ${DB.customers.length} in the database</div></div>
      </div>
      <p class="hint" style="margin-top:10px"><i class="fa-solid fa-circle-info"></i>
        Everything — customers, deals, bookings, activity photos, GPS pins, list views, assignment rules, incentives — is stored permanently on the
        server (<span class="mono">${esc(API_BASE)}</span>), not in this browser. Sign in from any machine and the same data is there.
        If the connection drops, changes are queued locally and pushed automatically once it returns. Use <b>Backup</b> before clearing.</p>
    </div></div>`;
}
function V7_saveNow(){
  V7_idbPut('db', JSON.parse(JSON.stringify(V7_snapshot())))
    .then(()=>{ V7_lastSave = new Date(); toast('Saved to the server'); render(); })
    .catch(e=>toast('Save failed: ' + e.message + ' — change is queued for retry','fa-triangle-exclamation'));
}
function V7_exportBackup(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(V7_snapshot(), null, 2)], {type:'application/json'}));
  a.download = 'inframantra-crm-backup-' + iso(now()) + '.json'; a.click();
  logDownload('Full CRM backup download (JSON)', a.download);
  toast('Backup downloaded');
}
function V7_importBackup(inp){
  const f = inp.files && inp.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const s = JSON.parse(rd.result);
      if(!V7_restore(s)) return toast('That file is not a CRM backup','fa-triangle-exclamation');
      V7_saveNow(); buildNav(); toast('Backup restored'); render();
    }catch(e){ toast('Could not read that file','fa-triangle-exclamation'); }
  };
  rd.readAsText(f);
}
function V7_wipe(){
  modal('Clear all stored data?', `<p class="hint" style="margin:0"><i class="fa-solid fa-triangle-exclamation" style="color:var(--bad)"></i>
    This deletes the CRM snapshot <b>on the server for everyone</b> and reloads with the demo seed. Download a backup first if you need it.</p>`,
   ()=>{
     V7_idbDelete('db')
       .then(()=>{ V7_outboxClear(); V6_clearToken(); location.reload(); })
       .catch(e=>toast('Could not clear server data: ' + e.message,'fa-triangle-exclamation'));
   }, 'Yes, clear everything');
}

/* wire the Data tab into Setup */
window.vSettings = function(){
  const T = SETUP_TAB;
  const tab = (k,l,ok) => ok ? `<button class="tab ${T === k ? 'on' : ''}" onclick="SETUP_TAB='${k}';render()">${l}</button>` : '';
  return `<div class="page-h"><div><h2>Setup</h2>
    <p>Pre Sales → <b>Customer</b> · Sales → <b>Deal</b> · Post Sales → <b>Booking</b>.
       You can edit: <b>${V6_editableObjects().join(', ') || 'nothing'}</b>.</p></div>
    <button class="btn btn-o" onclick="V6_changeMyPassword()"><i class="fa-solid fa-key"></i> Change my password</button></div>
  <div class="tabs">
    ${tab('picklists','Picklists', act('manageSettings'))}
    ${tab('channels','Lead channels', act('manageSettings'))}
    ${tab('intake','Lead intake (no API)', act('manageSettings') || act('manageAssignment'))}
    ${tab('assign','Lead assignment', act('manageAssignment'))}
    ${tab('sharing','Sharing &amp; access', act('manageShares'))}
    ${tab('profiles','Profiles &amp; permissions', act('manageUsers'))}
    ${tab('users','Users', act('manageUsers'))}
    ${tab('hierarchy','Role Hierarchy', act('manageUsers'))}
    ${tab('security','Security &amp; passwords', act('manageUsers'))}
    ${tab('storage','Data &amp; storage', act('manageUsers'))}
    ${tab('bas','Business Associates', act('manageUsers'))}
    ${tab('scale','Scale &amp; performance', act('manageUsers'))}
  </div>
  ${T === 'picklists' && act('manageSettings') ? vPicklists()
   : T === 'channels' && act('manageSettings') ? vChannels()
   : T === 'intake'   ? vIntake()
   : T === 'assign'   ? vAssignment()
   : T === 'sharing'  ? vSharing()
   : T === 'security' ? vSecurity()
   : T === 'storage' && act('manageUsers') ? vStorage()
   : T === 'profiles' && act('manageUsers') ? vProfiles()
   : T === 'users'    && act('manageUsers') ? vUsers()
   : T === 'hierarchy'&& act('manageUsers') ? vHierarchy()
   : T === 'scale'    && act('manageUsers') ? vScale()
   : T === 'bas'      && act('manageUsers') ? vBAs()
   : act('manageAssignment') ? vAssignment()
   : act('manageSettings')   ? vPicklists()
   : denied('setup')}`;
};
